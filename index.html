    /* =========================================================
     * クラウド同期（Firebase Authentication + Cloud Firestore）
     *
     * Firestore の構造:
     *   users/{uid}                 … { exercises: [...] }
     *   users/{uid}/days/{日付}      … { workouts: [...], bodyweight: number|null }
     *
     * 画面側は従来どおり state を書き換えて save() を呼ぶだけ。
     * flush() が「最後に同期した内容」との差分を調べ、変わった日付のドキュメントだけを書き込む。
     * ========================================================= */
    const EMPTY_DAY_KEY = JSON.stringify({ workouts: [], bodyweight: null });
    const cloud = {
      A: null, F: null,          // firebase-auth / firebase-firestore モジュール
      app: null,
      auth: null, db: null,
      authResolved: false,
      user: null,
      unsubs: [],
      synced: { exercises: null, days: new Map() }, // 最後にクラウドと一致していた内容（JSON文字列）
      loaded: { meta: false, days: false },
      server: { meta: false, days: false },
      metaExists: false,
      dayDocCount: 0,
      initialized: false,
      pending: 0,
      timer: null,
      error: '',
      syncError: '',
    };
    let pendingRender = false;

    const dayPayload = (d) => ({
      workouts: state.workouts[d] || [],
      bodyweight: state.bodyweight[d] ?? null,
    });
    const dayKey = (d) => JSON.stringify(dayPayload(d));
    const normDay = (data) => ({
      workouts: normEntries(data && data.workouts),
      bodyweight: normBodyweight(data && data.bodyweight),
    });

    function applyDay(d, payload) {
      if (payload && payload.workouts.length) state.workouts[d] = payload.workouts;
      else delete state.workouts[d];
      if (payload && payload.bodyweight !== null) state.bodyweight[d] = payload.bodyweight;
      else delete state.bodyweight[d];
    }

    function setLastMode(m) { try { localStorage.setItem(MODE_KEY, m); } catch { /* noop */ } }
    const initFlagKey = (uid) => `liftlog.cloudInit.${uid}`;
    const getFlag = (k) => { try { return localStorage.getItem(k) === '1'; } catch { return false; } };
    const setFlag = (k) => { try { localStorage.setItem(k, '1'); } catch { /* noop */ } };

    let loadingTimer = null;
    function showLoading(on) {
      const el = $('#loadingOverlay');
      el.classList.toggle('hidden', !on);
      el.classList.toggle('grid', on);
      clearTimeout(loadingTimer);
      $('#loadingHelp').classList.add('hidden');
      // 長く応答がない場合は案内と逃げ道を表示
      if (on) loadingTimer = setTimeout(() => $('#loadingHelp').classList.remove('hidden'), 12000);
    }
    $('#loadingOverlay').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-loading]');
      if (!btn) return;
      if (btn.dataset.loading === 'reload') { location.reload(); return; }
      try { if (cloud.A && cloud.auth) await cloud.A.signOut(cloud.auth); else stopCloud(); }
      catch { stopCloud(); }
    });

    // 入力中に画面を描き直すとフォーカスが外れるため、入力が終わるまで待つ
    function requestRender() {
      const a = document.activeElement;
      if (a && a.matches('input, select, textarea')) { pendingRender = true; return; }
      pendingRender = false;
      renderAll();
    }
    document.addEventListener('focusout', () => setTimeout(() => {
      if (!pendingRender) return;
      const a = document.activeElement;
      if (!(a && a.matches('input, select, textarea'))) { pendingRender = false; renderAll(); }
    }, 0));

    function authErrorMessage(e) {
      const code = (e && e.code) || '';
      if (code === 'auth/unauthorized-domain') return 'このURLはFirebaseの「承認済みドメイン」に登録されていません';
      if (code === 'auth/operation-not-supported-in-this-environment') return 'ファイルを直接開いた状態ではログインできません。公開したURL（GitHub Pages など）から開いてください';
      if (code === 'auth/network-request-failed') return 'ネットワークに接続できません';
      if (code === 'permission-denied') return 'アクセスが拒否されました（Firestoreのルールを確認してください）';
      return `エラーが発生しました（${code || (e && e.message) || '不明'}）`;
    }

    async function initCloud() {
      if (!CLOUD_ENABLED) { renderAuth(); return; }
      if (mode === 'pending') showLoading(true);
      renderAuth();
      try {
        const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
        const [appM, authM, fsM] = await Promise.all([
          import(base + 'firebase-app.js'),
          import(base + 'firebase-auth.js'),
          import(base + 'firebase-firestore.js'),
        ]);
        cloud.A = authM;
        cloud.F = fsM;
        const app = appM.initializeApp(FIREBASE_CONFIG);
        cloud.app = app;
        cloud.auth = authM.getAuth(app);
        try {
          // オフラインでも記録でき、電波が戻ったら自動で送信される
          cloud.db = fsM.initializeFirestore(app, {
            localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }),
          });
        } catch (e) {
          console.warn('永続キャッシュを使えないため通常モードで接続します', e);
          cloud.db = fsM.getFirestore(app);
        }
        authM.getRedirectResult(cloud.auth).catch((e) => toast(authErrorMessage(e), 'error'));
        authM.onAuthStateChanged(cloud.auth, (user) => {
          cloud.authResolved = true;
          if (user) startCloud(user);
          else stopCloud();
        });
      } catch (e) {
        console.error(e);
        cloud.error = 'Firebaseを読み込めませんでした';
        cloud.authResolved = true;
        toast('クラウドに接続できないため、この端末のデータで表示しています', 'error');
        stopCloud();
      }
    }

    function unsubscribeAll() {
      cloud.unsubs.forEach((fn) => { try { fn(); } catch { /* noop */ } });
      cloud.unsubs = [];
    }

    function startCloud(user) {
      unsubscribeAll();
      cloud.user = user;
      cloud.synced = { exercises: null, days: new Map() };
      cloud.loaded = { meta: false, days: false };
      cloud.server = { meta: false, days: false };
      cloud.metaExists = false;
      cloud.dayDocCount = 0;
      cloud.initialized = false;
      cloud.syncError = '';
      mode = 'cloud';
      setLastMode('cloud');
      state = emptyData();
      ui.selectedExerciseId = '';
      showLoading(true);
      renderAll();

      const { doc, collection, onSnapshot } = cloud.F;
      const userRef = doc(cloud.db, 'users', user.uid);
      const daysRef = collection(cloud.db, 'users', user.uid, 'days');
      cloud.unsubs.push(onSnapshot(userRef, { includeMetadataChanges: true }, onMetaSnapshot, onCloudError));
      cloud.unsubs.push(onSnapshot(daysRef, { includeMetadataChanges: true }, onDaysSnapshot, onCloudError));
    }

    function stopCloud() {
      unsubscribeAll();
      clearTimeout(cloud.timer);
      cloud.user = null;
      cloud.initialized = false;
      aiState.history = [];
      aiState.messages = [];
      mode = 'local';
      setLastMode('local');
      state = load();
      ui.selectedExerciseId = '';
      showLoading(false);
      renderAll();
    }

    function onCloudError(e) {
      console.error(e);
      cloud.syncError = authErrorMessage(e);
      showLoading(false);
      toast(cloud.syncError, 'error');
      renderAuth();
    }

    function onMetaSnapshot(snap) {
      cloud.metaExists = snap.exists();
      const remote = snap.exists() ? normExercises(snap.data().exercises) : [];
      const remoteKey = JSON.stringify(remote);
      const localKey = JSON.stringify(state.exercises);
      const dirty = cloud.synced.exercises !== null && localKey !== cloud.synced.exercises;
      let changed = false;
      if (!dirty) {
        if (remoteKey !== localKey) { state.exercises = remote; changed = true; }
        cloud.synced.exercises = remoteKey;
      } else if (remoteKey !== cloud.synced.exercises) {
        // 両方で変更されていた場合は、IDで統合（同じIDはこの端末の内容を優先）
        const ids = new Set(state.exercises.map((e) => e.id));
        const add = remote.filter((e) => !ids.has(e.id));
        if (add.length) { state.exercises.push(...add); changed = true; }
        cloud.synced.exercises = remoteKey;
        scheduleFlush();
      }
      cloud.loaded.meta = true;
      if (!snap.metadata.fromCache) cloud.server.meta = true;
      afterSnapshot(changed);
    }

    function onDaysSnapshot(snap) {
      let changed = false;
      cloud.dayDocCount = snap.size;
      for (const ch of snap.docChanges()) {
        const d = ch.doc.id;
        if (!DATE_RE.test(d)) continue;
        const localKey = dayKey(d);
        const dirty = (cloud.synced.days.get(d) ?? EMPTY_DAY_KEY) !== localKey;
        if (ch.type === 'removed') {
          if (!dirty) {
            if (localKey !== EMPTY_DAY_KEY) { applyDay(d, null); changed = true; }
            cloud.synced.days.delete(d);
          }
          continue;
        }
        const remote = normDay(ch.doc.data());
        const remoteKey = JSON.stringify(remote);
        if (!dirty) {
          if (remoteKey !== localKey) { applyDay(d, remote); changed = true; }
          cloud.synced.days.set(d, remoteKey);
        } else if (remoteKey === localKey) {
          cloud.synced.days.set(d, remoteKey);
        }
        // dirty かつ内容が違う場合は、この端末の未送信の変更を優先（次の flush で上書き）
      }
      cloud.loaded.days = true;
      if (!snap.metadata.fromCache) cloud.server.days = true;
      afterSnapshot(changed);
    }

    function afterSnapshot(changed) {
      if (!cloud.initialized) {
        const knownDevice = cloud.user && getFlag(initFlagKey(cloud.user.uid));
        const serverReady = cloud.server.meta && cloud.server.days;
        const cacheReady = cloud.loaded.meta && cloud.loaded.days && knownDevice;
        if (serverReady || cacheReady) initializeCloudData(serverReady);
        return;
      }
      if (changed) requestRender();
      else renderAuth();
    }

    function localHasRecords(d) {
      return Object.keys(d.bodyweight).length > 0 ||
        Object.values(d.workouts).some((list) => list.some((en) => validSets(en.sets).length > 0));
    }

    // この端末のデータをクラウドのデータに統合（同じ日・同じ種目はクラウド優先）
    function mergeLocalData(local) {
      const byName = new Map(state.exercises.map((e) => [e.name.trim().toLowerCase(), e.id]));
      const idMap = {};
      for (const ex of local.exercises) {
        const k = ex.name.trim().toLowerCase();
        if (byName.has(k)) { idMap[ex.id] = byName.get(k); continue; }
        const id = state.exercises.some((e) => e.id === ex.id) ? uid() : ex.id;
        state.exercises.push(ex.bw ? { id, name: ex.name, bw: true } : { id, name: ex.name });
        byName.set(k, id);
        idMap[ex.id] = id;
      }
      for (const [d, entries] of Object.entries(local.workouts)) {
        const list = state.workouts[d] ? [...state.workouts[d]] : [];
        for (const en of entries) {
          if (!validSets(en.sets).length) continue;
          const exerciseId = idMap[en.exerciseId] || en.exerciseId;
          if (list.some((x) => x.exerciseId === exerciseId)) continue;
          list.push({ id: uid(), exerciseId, sets: en.sets.map((s) => ({ weight: s.weight, reps: s.reps })) });
        }
        if (list.length) state.workouts[d] = list;
      }
      for (const [d, v] of Object.entries(local.bodyweight)) {
        if (state.bodyweight[d] === undefined) state.bodyweight[d] = v;
      }
    }

    function initializeCloudData(serverConfirmed) {
      cloud.initialized = true;
      const flagKey = initFlagKey(cloud.user.uid);
      const firstTimeOnDevice = !getFlag(flagKey);
      setFlag(flagKey);
      showLoading(false);

      if (serverConfirmed && firstTimeOnDevice) {
        const local = load();
        const cloudEmpty = !cloud.metaExists && cloud.dayDocCount === 0;
        if (cloudEmpty) {
          // クラウドが空 = はじめての利用
          if (localHasRecords(local) &&
              confirm('クラウドにはまだデータがありません。\nこの端末に保存されている記録をクラウドにアップロードしますか？\n\n（「キャンセル」で空の状態から始めます）')) {
            state = local;
          } else {
            state.exercises = local.exercises.length ? local.exercises : defaultData().exercises;
          }
          toast('クラウド同期を開始しました');
        } else if (localHasRecords(local) &&
                   confirm('この端末にもログイン前の記録があります。\nクラウドのデータに統合しますか？\n\n（同じ日の同じ種目・体重はクラウド側を優先します）')) {
          mergeLocalData(local);
          toast('この端末の記録をクラウドに統合しました');
        }
      }
      flush();
      renderAll();
    }

    function scheduleFlush() {
      clearTimeout(cloud.timer);
      cloud.timer = setTimeout(flush, 600);
    }

    function trackWrite(promise) {
      cloud.pending++;
      renderAuth();
      promise
        .catch((e) => { console.error(e); cloud.syncError = authErrorMessage(e); toast('クラウドへの保存に失敗しました：' + cloud.syncError, 'error'); })
        .finally(() => { cloud.pending--; renderAuth(); });
    }

    function flush() {
      clearTimeout(cloud.timer);
      cloud.timer = null;
      if (mode !== 'cloud' || !cloud.user || !cloud.initialized) return;
      const { doc, writeBatch, serverTimestamp } = cloud.F;
      const uidStr = cloud.user.uid;
      const ops = [];

      const exKey = JSON.stringify(state.exercises);
      if (exKey !== cloud.synced.exercises) {
        ops.push({ type: 'set', ref: doc(cloud.db, 'users', uidStr), data: { exercises: state.exercises, updatedAt: serverTimestamp() } });
        cloud.synced.exercises = exKey;
      }

      const dates = new Set([...Object.keys(state.workouts), ...Object.keys(state.bodyweight), ...cloud.synced.days.keys()]);
      for (const d of dates) {
        const key = dayKey(d);
        if (key === (cloud.synced.days.get(d) ?? EMPTY_DAY_KEY)) continue;
        const ref = doc(cloud.db, 'users', uidStr, 'days', d);
        if (key === EMPTY_DAY_KEY) {
          ops.push({ type: 'delete', ref });
          cloud.synced.days.delete(d);
        } else {
          ops.push({ type: 'set', ref, data: { ...dayPayload(d), updatedAt: serverTimestamp() } });
          cloud.synced.days.set(d, key);
        }
      }

      // 1バッチ500件までの制限に合わせて分割
      for (let i = 0; i < ops.length; i += 400) {
        const batch = writeBatch(cloud.db);
        for (const op of ops.slice(i, i + 400)) {
          if (op.type === 'set') batch.set(op.ref, op.data);
          else batch.delete(op.ref);
        }
        trackWrite(batch.commit());
      }
    }

    async function login() {
      if (!cloud.A) { toast(cloud.error || 'Firebaseの準備中です。少し待ってからもう一度お試しください', 'error'); return; }
      const { GoogleAuthProvider, signInWithPopup, signInWithRedirect } = cloud.A;
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      try {
        await signInWithPopup(cloud.auth, provider);
      } catch (e) {
        if (e.code === 'auth/popup-blocked') {
          await signInWithRedirect(cloud.auth, provider);
        } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
          toast(authErrorMessage(e), 'error');
        }
      }
    }

    async function logout() {
      if (!confirm('ログアウトしますか？\n（クラウドのデータは消えません。再ログインでまた表示されます）')) return;
      flush();
      if (cloud.pending > 0 && !navigator.onLine &&
          !confirm('まだクラウドに送信していない記録があります。\nオンラインに戻ってから送信されますが、このままログアウトしますか？')) return;
      try {
        if (cloud.pending > 0 && navigator.onLine) {
          await Promise.race([cloud.F.waitForPendingWrites(cloud.db), new Promise((r) => setTimeout(r, 4000))]);
        }
        await cloud.A.signOut(cloud.auth);
        toast('ログアウトしました');
      } catch (e) {
        toast(authErrorMessage(e), 'error');
      }
    }

    function renderAuth() {
      const area = $('#authArea');
      let html = '';
      let note = '';
      if (!CLOUD_ENABLED) {
        note = 'データはこのブラウザ内（localStorage）にのみ保存されます。ブラウザのデータ削除で消えるため、定期的にエクスポートでバックアップしてください。';
      } else if (!cloud.authResolved) {
        html = `<span class="flex items-center gap-1.5 rounded-full bg-slate-800 px-2.5 py-1 text-[11px] font-bold text-slate-400 ring-1 ring-white/5">
                  <span class="h-2 w-2 animate-pulse rounded-full bg-slate-400"></span><span class="hidden sm:inline">接続中…</span></span>`;
        note = 'クラウドに接続しています…';
      } else if (!cloud.user) {
        html = `<button data-auth="login" class="btn btn-primary px-2.5 sm:px-3" title="Googleアカウントでログインして、スマホとPCで同期">
                  <i data-lucide="log-in"></i><span class="hidden sm:inline">ログインして同期</span></button>`;
        note = 'ログインしていないため、この端末だけに保存されています。ログインするとスマホとPCで記録を同期できます。';
      } else {
        let dot = 'bg-emerald-400', label = '同期済み';
        if (cloud.syncError) { dot = 'bg-rose-500'; label = '同期エラー'; }
        else if (!navigator.onLine) { dot = 'bg-slate-400'; label = cloud.pending ? 'オフライン（未送信あり）' : 'オフライン'; }
        else if (cloud.pending || cloud.timer) { dot = 'bg-amber-400 animate-pulse'; label = '同期中…'; }
        html = `
          <span class="flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-bold ring-1 ${cloud.syncError ? 'bg-rose-500/15 text-rose-300 ring-rose-400/40' : 'bg-slate-800 text-slate-300 ring-white/5'}" title="${esc(cloud.syncError || label)}">
            <span class="h-2 w-2 rounded-full ${dot}"></span><span class="hidden sm:inline">${esc(label)}</span>
          </span>
          <button data-auth="logout" class="icon-btn" title="ログアウト（${esc(cloud.user.email || '')}）"><i data-lucide="log-out"></i></button>`;
        note = cloud.syncError
          ? `同期エラー：${esc(cloud.syncError)}。Firebaseの設定を確認してから、ページを再読み込みしてください。`
          : `クラウド同期中：${esc(cloud.user.email || '')}。どの端末でも同じアカウントでログインすれば同じ記録が表示されます。電波がない場所での記録も、接続が戻ると自動で送信されます。`;
      }
      area.innerHTML = html;
      $$('[data-role="storage-note"]').forEach((el) => { el.innerHTML = note; });
      icons();
    }

    $('#authArea').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-auth]');
      if (!btn) return;
      if (btn.dataset.auth === 'login') login();
      if (btn.dataset.auth === 'logout') logout();
    });
    window.addEventListener('online', renderAuth);
    window.addEventListener('offline', renderAuth);
    // 画面を閉じる・切り替える前に未送信の変更を送る
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && cloud.timer) flush(); });
    window.addEventListener('pagehide', () => { if (cloud.timer) flush(); });

    /* =========================================================
     * イベント
     * ========================================================= */
    // 日付
    $('#prevDay').addEventListener('click', () => setDate(addDays(ui.date, -1)));
    $('#nextDay').addEventListener('click', () => setDate(addDays(ui.date, 1)));
    $('#btnToday').addEventListener('click', () => setDate(todayStr()));
    $('#datePicker').addEventListener('change', (e) => { if (e.target.value) setDate(e.target.value); });
    $('#btnCal').addEventListener('click', () => { ui.calOpen = !ui.calOpen; renderCalToggle(); });

    // カレンダー
    $('#calendar').addEventListener('click', (e) => {
      const nav = e.target.closest('[data-cal]');
      if (nav) {
        ui.calMonth += nav.dataset.cal === 'prev' ? -1 : 1;
        if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; }
        if (ui.calMonth > 11) { ui.calMonth = 0; ui.calYear++; }
        renderCalendar();
        icons();
        return;
      }
      const day = e.target.closest('[data-date]');
      if (day) setDate(day.dataset.date);
    });

    // タブ
    $$('.tab-btn').forEach((b) => b.addEventListener('click', () => {
      ui.tab = b.dataset.tab;
      saveUI();
      renderTabs();
    }));

    // 種目選択
    $('#exerciseSelect').addEventListener('change', (e) => {
      ui.selectedExerciseId = e.target.value;
      renderExerciseSelect();
      renderSelectPreview();
      icons();
    });
    $('#btnAddEntry').addEventListener('click', () => addEntry(ui.selectedExerciseId));
    $('#btnManageEx').addEventListener('click', openExModal);

    // セット入力（フォーカスを維持したまま即時保存）
    const entryList = $('#entryList');
    entryList.addEventListener('input', (e) => {
      const inp = e.target.closest('input[data-field]');
      if (!inp) return;
      const card = inp.closest('[data-entry-id]');
      const entry = getEntry(card.dataset.entryId);
      const idx = Number(inp.dataset.index);
      if (!entry || !entry.sets[idx]) return;
      let v = num(inp.value);
      if (v !== null && v < 0) v = null;
      if (v !== null && inp.dataset.field === 'reps') v = Math.floor(v);
      if (v !== null && inp.dataset.field === 'weight') v = r2(v);
      const field = inp.dataset.field;
      const old = entry.sets[idx][field];
      entry.sets[idx][field] = v;
      // 1セット目を入力したら、まだ同じ値（または空）のセットにも反映
      if (idx === 0) {
        entry.sets.forEach((s, i) => {
          if (i === 0 || (s[field] !== old && s[field] !== null)) return;
          s[field] = v;
          const other = $(`[data-row="${i}"] input[data-field="${field}"]`, card);
          if (other) other.value = field === 'weight' ? fmtNum(v) : (v ?? '');
        });
      }
      save();
      updateCardIndicators(card, entry);
      renderDaySummary();
      renderCalendar();
      renderStats();
      icons();
    });

    // Enterで次の入力欄へ
    entryList.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || !e.target.matches('input[data-field]')) return;
      e.preventDefault();
      const inputs = $$('input[data-field]', e.target.closest('[data-entry-id]'));
      const next = inputs[inputs.indexOf(e.target) + 1];
      if (next) next.focus(); else e.target.blur();
    });

    entryList.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const card = btn.closest('[data-entry-id]');
      const entryId = card.dataset.entryId;
      const entry = getEntry(entryId);
      if (!entry) return;

      if (btn.dataset.action === 'add-set') {
        const last = entry.sets[entry.sets.length - 1];
        entry.sets.push({ weight: last ? last.weight : null, reps: last ? last.reps : null });
        save();
        const fresh = rerenderCard(entryId);
        const rows = fresh ? $$('[data-row]', fresh) : [];
        const row = rows[rows.length - 1];
        if (row) $(last && last.weight !== null ? 'input[data-field="reps"]' : 'input[data-field="weight"]', row).focus();
      }

      if (btn.dataset.action === 'delete-set') {
        entry.sets.splice(Number(btn.dataset.index), 1);
        save();
        rerenderCard(entryId);
        renderCalendar();
        renderStats();
        icons();
      }

      if (btn.dataset.action === 'delete-entry') {
        const ex = getExercise(entry.exerciseId);
        if (validSets(entry.sets).length && !confirm(`「${ex ? ex.name : '不明な種目'}」のこの日の記録を削除しますか？`)) return;
        state.workouts[ui.date] = dayEntries().filter((x) => x.id !== entryId);
        save();
        renderWorkout();
        renderCalendar();
        renderStats();
        icons();
        toast('記録を削除しました');
      }
    });

    // 体重
    $('#weightInput').addEventListener('input', renderWeightDiff);
    $('#weightForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = num($('#weightInput').value);
      if (v === null || v <= 0 || v >= 500) {
        toast('正しい体重（0〜500kg）を入力してください', 'error');
        return;
      }
      state.bodyweight[ui.date] = r2(v);
      save();
      renderWeight();
      renderCalendar();
      renderStats();
      icons();
      toast(`${fmtShort(ui.date)} の体重 ${r2(v).toFixed(2)}kg を保存しました`);
    });
    $('#btnDeleteWeight').addEventListener('click', () => {
      if (!confirm(`${fmtShort(ui.date)} の体重記録を削除しますか？`)) return;
      delete state.bodyweight[ui.date];
      save();
      renderWeight();
      renderCalendar();
      renderStats();
      icons();
      toast('体重記録を削除しました');
    });
    $('#weightHistory').addEventListener('click', (e) => {
      const row = e.target.closest('[data-wdate]');
      if (row) setDate(row.dataset.wdate);
    });

    // 種目管理モーダル
    $('#exModal').addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) { closeExModal(); return; }
      const btn = e.target.closest('[data-ex-action]');
      if (!btn) return;
      const id = btn.closest('[data-ex-id]').dataset.exId;
      const ex = getExercise(id);
      if (!ex) return;

      if (btn.dataset.exAction === 'toggle-bw') {
        if (ex.bw) delete ex.bw; else ex.bw = true;
        save();
        renderExList();
        renderWorkout();
        if (ui.tab === 'stats') renderAnalytics();
        toast(ex.bw ? `「${ex.name}」を自重種目にしました` : `「${ex.name}」を通常の種目にしました`);
        return;
      }

      if (btn.dataset.exAction === 'rename') {
        const name = prompt('新しい種目名を入力してください', ex.name);
        if (name === null) return;
        const trimmed = name.trim().slice(0, 40);
        if (!trimmed) { toast('種目名を入力してください', 'error'); return; }
        if (nameExists(trimmed, id)) { toast('同じ名前の種目が既にあります', 'error'); return; }
        ex.name = trimmed;
        save();
        renderExList();
        renderWorkout();
        toast('種目名を変更しました');
      }

      if (btn.dataset.exAction === 'delete') {
        const c = countRecords(id);
        const msg = c
          ? `「${ex.name}」を削除しますか？\n\nこの種目の記録（${c}日分）もすべて削除されます。この操作は元に戻せません。`
          : `「${ex.name}」を削除しますか？`;
        if (!confirm(msg)) return;
        state.exercises = state.exercises.filter((x) => x.id !== id);
        for (const d of Object.keys(state.workouts)) {
          state.workouts[d] = state.workouts[d].filter((en) => en.exerciseId !== id);
        }
        if (ui.selectedExerciseId === id) ui.selectedExerciseId = '';
        save();
        renderExList();
        renderWorkout();
        renderCalendar();
        renderStats();
        icons();
        toast('種目を削除しました');
      }
    });

    // 名前から自重種目らしければ自動でチェック（手動で切り替えた後は触らない）
    let exBwTouched = false;
    const BW_NAME_RE = /懸垂|チンニング|チンアップ|プルアップ|ディップス|腕立て|プッシュアップ|自重|レッグレイズ|プランク/i;
    $('#exBwInput').addEventListener('change', () => { exBwTouched = true; });
    $('#exNameInput').addEventListener('input', (e) => {
      if (!exBwTouched) $('#exBwInput').checked = BW_NAME_RE.test(e.target.value);
    });

    $('#exAddForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('#exNameInput');
      const name = input.value.trim().slice(0, 40);
      if (!name) { toast('種目名を入力してください', 'error'); return; }
      if (nameExists(name)) { toast('同じ名前の種目が既にあります', 'error'); return; }
      const ex = $('#exBwInput').checked ? { id: uid(), name, bw: true } : { id: uid(), name };
      state.exercises.push(ex);
      $('#exBwInput').checked = false;
      exBwTouched = false;
      ui.selectedExerciseId = ex.id;
      save();
      input.value = '';
      renderExList();
      renderWorkout();
      renderStats();
      icons();
      toast(`「${name}」を追加しました`);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isModalOpen()) closeExModal();
    });

    // エクスポート / インポート
    $('#btnExport').addEventListener('click', exportData);
    $('#btnImport').addEventListener('click', () => $('#importFile').click());
    $('#importFile').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) await importData(file);
      e.target.value = '';
    });

    // 数値入力欄でのホイールによる誤変更を防止
    document.addEventListener('wheel', (e) => {
      const el = document.activeElement;
      if (el && el.type === 'number' && el === e.target) el.blur();
    }, { passive: true });

    // 別タブでの変更を反映
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY && mode === 'local') { state = load(); renderAll(); }
    });

    /* =========================================================
     * 起動
     * ========================================================= */
    if (mode === 'local') save();
    renderAll();
    initCloud();
  })();
  </script>
</body>
</html>
