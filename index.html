<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>LiftLog - 筋トレ重量メモ＆体重記録</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '"Noto Sans JP"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style type="text/tailwindcss">
    .card {
      @apply rounded-2xl border border-white/10 bg-slate-900/70 shadow-xl shadow-black/30 backdrop-blur;
    }
    .input {
      @apply rounded-xl border border-white/10 bg-slate-800/80 px-3 py-2 text-slate-100 placeholder-slate-500 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-500/30 disabled:opacity-50;
    }
    .btn {
      @apply inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-xl px-3 py-2 text-sm font-semibold transition active:scale-[.98] disabled:pointer-events-none disabled:opacity-40;
    }
    .btn-primary {
      @apply bg-violet-600 text-white shadow-lg shadow-violet-600/25 hover:bg-violet-500;
    }
    .btn-secondary {
      @apply border border-white/10 bg-slate-800 text-slate-200 hover:bg-slate-700;
    }
    .btn-ghost {
      @apply text-slate-300 hover:bg-white/5 hover:text-white;
    }
    .btn-danger {
      @apply border border-rose-500/30 bg-rose-500/10 text-rose-300 hover:bg-rose-500/20;
    }
    .icon-btn {
      @apply inline-grid place-items-center rounded-xl p-2 text-slate-300 transition hover:bg-white/5 hover:text-white active:scale-95;
    }
    .tab-btn {
      @apply flex flex-1 items-center justify-center gap-1.5 rounded-xl px-2 py-2.5 text-sm font-bold sm:gap-2 sm:px-4 text-slate-400 transition hover:text-slate-200;
    }
    .tab-btn.active {
      @apply bg-violet-600 text-white shadow-lg shadow-violet-600/25;
    }
  </style>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    input[type="date"], select { color-scheme: dark; }
    .btn svg { width: 1rem; height: 1rem; flex-shrink: 0; }
    .icon-btn svg { width: 1.125rem; height: 1.125rem; }
    .tab-btn svg { width: 1.125rem; height: 1.125rem; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    @keyframes pop { 0% { transform: scale(.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .anim-pop { animation: pop .18s ease-out; }
  </style>
</head>

<body class="min-h-screen bg-slate-950 font-sans text-slate-100 antialiased">
  <!-- 背景グロー -->
  <div class="pointer-events-none fixed inset-x-0 top-0 -z-0 h-72 bg-gradient-to-b from-violet-700/15 via-violet-900/5 to-transparent"></div>

  <!-- ヘッダー -->
  <header class="sticky top-0 z-30 border-b border-white/5 bg-slate-950/80 backdrop-blur-lg">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
      <div class="flex items-center gap-2.5">
        <div class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-violet-500 to-fuchsia-600 shadow-lg shadow-violet-600/30">
          <i data-lucide="dumbbell" class="h-5 w-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-base font-extrabold leading-tight tracking-tight">LiftLog</h1>
          <p class="hidden text-[11px] leading-tight text-slate-400 sm:block">筋トレ重量メモ＆体重記録</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <div id="authArea" class="flex items-center gap-1.5"></div>
        <button id="btnExport" class="btn btn-ghost" title="JSON形式でデータを書き出し">
          <i data-lucide="download"></i><span class="hidden sm:inline">エクスポート</span>
        </button>
        <button id="btnImport" class="btn btn-ghost" title="JSONファイルからデータを読み込み">
          <i data-lucide="upload"></i><span class="hidden sm:inline">インポート</span>
        </button>
        <input type="file" id="importFile" accept="application/json,.json" class="hidden">
      </div>
    </div>
  </header>

  <main class="relative mx-auto grid max-w-6xl gap-4 px-4 py-4 lg:grid-cols-[340px_minmax(0,1fr)] lg:gap-6 lg:py-6">
    <!-- サイドバー：日付・カレンダー -->
    <aside class="space-y-4 lg:sticky lg:top-[76px] lg:self-start">
      <section class="card p-4">
        <div class="flex items-center justify-between gap-2">
          <button id="prevDay" class="icon-btn" title="前の日"><i data-lucide="chevron-left"></i></button>
          <div class="min-w-0 text-center">
            <div id="dateLabel" class="truncate text-lg font-extrabold tracking-tight"></div>
            <div id="dateRel" class="mt-0.5 text-xs font-semibold"></div>
          </div>
          <button id="nextDay" class="icon-btn" title="次の日"><i data-lucide="chevron-right"></i></button>
        </div>
        <div class="mt-3 flex gap-2">
          <input type="date" id="datePicker" class="input min-w-0 flex-1 text-sm">
          <button id="btnToday" class="btn btn-secondary">今日</button>
          <button id="btnCal" class="icon-btn border border-white/10 bg-slate-800 lg:hidden" title="カレンダーを表示">
            <i data-lucide="calendar-days"></i>
          </button>
        </div>
        <div id="calendarWrap" class="mt-4 hidden lg:block">
          <div id="calendar"></div>
        </div>
      </section>

      <section class="card hidden p-4 lg:block">
        <h2 class="flex items-center gap-2 text-sm font-bold text-slate-300">
          <i data-lucide="database" class="h-4 w-4"></i>データ
        </h2>
        <dl id="dataStats" class="mt-3 grid grid-cols-3 gap-2 text-center"></dl>
        <p data-role="storage-note" class="mt-3 text-[11px] leading-relaxed text-slate-500"></p>
      </section>
    </aside>

    <!-- メインコンテンツ -->
    <section class="min-w-0 space-y-4">
      <!-- タブ -->
      <div class="card flex gap-1 p-1.5" role="tablist">
        <button class="tab-btn" data-tab="workout" role="tab"><i data-lucide="dumbbell"></i>筋トレ</button>
        <button class="tab-btn" data-tab="weight" role="tab"><i data-lucide="scale"></i>体重</button>
        <button class="tab-btn" data-tab="stats" role="tab"><i data-lucide="chart-line"></i>統計</button>
        <button class="tab-btn" data-tab="ai" role="tab"><i data-lucide="sparkles"></i>AI</button>
      </div>

      <!-- 筋トレタブ -->
      <div id="tabWorkout" class="space-y-4">
        <section class="card p-4">
          <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
            <h2 class="flex items-center gap-2 font-bold">
              <i data-lucide="list-plus" class="h-5 w-5 text-violet-400"></i>種目を選んで記録
            </h2>
            <span id="daySummary" class="text-xs font-medium text-slate-400"></span>
          </div>
          <div class="flex flex-col gap-2 sm:flex-row">
            <select id="exerciseSelect" class="input min-w-0 flex-1"></select>
            <div class="flex gap-2">
              <button id="btnAddEntry" class="btn btn-primary flex-1 sm:flex-none"><i data-lucide="plus"></i>記録に追加</button>
              <button id="btnManageEx" class="btn btn-secondary flex-1 sm:flex-none"><i data-lucide="settings-2"></i>種目を追加</button>
            </div>
          </div>
          <div id="selectPreview" class="mt-3"></div>
        </section>

        <div id="entryList" class="space-y-4"></div>
      </div>

      <!-- 体重タブ -->
      <div id="tabWeight" class="hidden space-y-4">
        <section class="card p-4 sm:p-5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="flex items-center gap-2 font-bold">
              <i data-lucide="scale" class="h-5 w-5 text-sky-400"></i><span id="wDateLabel"></span>
            </h2>
            <span id="weightStatus"></span>
          </div>
          <form id="weightForm" class="mt-4 flex items-end gap-2" autocomplete="off">
            <label class="min-w-0 flex-1">
              <span class="text-xs font-semibold text-slate-400">体重 (kg・小数点第2位まで)</span>
              <div class="relative mt-1">
                <input id="weightInput" type="number" inputmode="decimal" step="0.01" min="0" max="500"
                  class="input w-full py-3 pr-12 text-2xl font-extrabold tabular-nums" placeholder="0.00">
                <span class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 font-semibold text-slate-400">kg</span>
              </div>
            </label>
            <button type="submit" class="btn btn-primary h-[58px] px-5"><i data-lucide="save"></i>保存</button>
          </form>
          <div id="weightDiff" class="mt-4"></div>
          <div class="mt-3 flex justify-end">
            <button id="btnDeleteWeight" class="btn btn-danger hidden"><i data-lucide="trash-2"></i>この日の体重を削除</button>
          </div>
        </section>

        <section class="card p-4 sm:p-5">
          <div class="mb-3 flex items-center justify-between">
            <h3 class="flex items-center gap-2 font-bold"><i data-lucide="history" class="h-5 w-5 text-slate-400"></i>最近の記録</h3>
            <span id="weightCount" class="text-xs text-slate-500"></span>
          </div>
          <div id="weightHistory"></div>
        </section>
      </div>

      <!-- AIコーチタブ -->
      <div id="tabAI" class="hidden space-y-4">
        <section class="card p-4 sm:p-5">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-start gap-3">
              <div class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-violet-500 to-fuchsia-600 shadow-lg shadow-violet-600/30">
                <i data-lucide="sparkles" class="h-5 w-5 text-white"></i>
              </div>
              <div>
                <h2 class="font-bold">AIコーチ</h2>
                <p class="text-xs text-slate-400">直近90日の記録をもとに、AI（Gemini）がアドバイスします</p>
              </div>
            </div>
            <button id="aiReset" class="btn btn-ghost hidden shrink-0 text-xs"><i data-lucide="rotate-ccw"></i>新しい相談</button>
          </div>
          <div id="aiNotice" class="mt-4 hidden rounded-xl bg-slate-800/60 px-4 py-3 text-sm text-slate-300 ring-1 ring-white/5"></div>
          <div id="aiPresets" class="mt-4 flex flex-wrap gap-2"></div>
          <form id="aiForm" class="mt-3 flex gap-2" autocomplete="off">
            <input id="aiInput" class="input min-w-0 flex-1" maxlength="500" placeholder="自由に質問（例：最近脚やってる？）">
            <button id="aiSend" type="submit" class="btn btn-primary px-3" title="送信"><i data-lucide="send"></i></button>
          </form>
          <p class="mt-2 text-[11px] leading-relaxed text-slate-500">
            送信すると、記録（種目名・重量・回数・日付・体重）がGoogleのGemini APIに送られます。AIの回答は参考情報です。痛みや体調の不安があるときは専門家に相談してください。
          </p>
        </section>
        <div id="aiThread" class="space-y-3"></div>
      </div>

      <!-- 統計タブ -->
      <div id="tabStats" class="hidden space-y-4">
        <section class="card p-4">
          <div class="flex flex-col gap-2 sm:flex-row">
            <select id="statTarget" class="input min-w-0 flex-1" aria-label="グラフにする種目"></select>
            <div id="statRange" class="grid grid-cols-4 gap-1 rounded-xl bg-slate-800/80 p-1 ring-1 ring-white/10" role="group" aria-label="期間"></div>
          </div>
          <div id="statMetric" class="mt-3 flex flex-wrap gap-1.5" role="group" aria-label="指標"></div>
          <p id="statMetricNote" class="mt-2 text-[11px] leading-relaxed text-slate-500"></p>
        </section>

        <div id="statTiles" class="grid grid-cols-2 gap-2 sm:grid-cols-4"></div>

        <section class="card p-4 sm:p-5">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <h3 id="statTitle" class="truncate font-bold"></h3>
              <p id="statSubtitle" class="text-[11px] text-slate-500"></p>
            </div>
            <button id="statTableToggle" class="btn btn-ghost shrink-0 text-xs"><i data-lucide="table"></i><span>表で見る</span></button>
          </div>
          <div id="statChart" class="relative mt-3 select-none"></div>
          <div id="statTable" class="mt-4 hidden"></div>
        </section>
      </div>

      <p data-role="storage-note" class="px-1 pb-6 text-center text-[11px] text-slate-600 lg:hidden"></p>
    </section>
  </main>

  <!-- 種目管理モーダル -->
  <div id="exModal" class="fixed inset-0 z-50 hidden items-end justify-center sm:items-center sm:p-4">
    <div data-close class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
    <div class="card anim-pop relative flex max-h-[85vh] w-full max-w-md flex-col rounded-b-none bg-slate-900 sm:rounded-2xl">
      <div class="flex items-center justify-between border-b border-white/5 px-4 py-3">
        <h2 class="flex items-center gap-2 font-bold"><i data-lucide="settings-2" class="h-5 w-5 text-violet-400"></i>種目の管理</h2>
        <button data-close class="icon-btn" title="閉じる"><i data-lucide="x"></i></button>
      </div>
      <form id="exAddForm" class="flex gap-2 p-4" autocomplete="off">
        <input id="exNameInput" class="input min-w-0 flex-1" maxlength="40" placeholder="例：ダンベルベンチプレス">
        <label class="flex shrink-0 cursor-pointer items-center gap-1.5 text-xs font-semibold text-slate-300" title="懸垂・ディップスなど、体重を使う種目">
          <input id="exBwInput" type="checkbox" class="h-4 w-4 accent-sky-500">自重
        </label>
        <button type="submit" class="btn btn-primary"><i data-lucide="plus"></i>追加</button>
      </form>
      <ul id="exList" class="space-y-2 overflow-y-auto px-4 pb-4"></ul>
    </div>
  </div>

  <!-- クラウド読み込み中 -->
  <div id="loadingOverlay" class="fixed inset-0 z-[70] hidden place-items-center bg-slate-950/90 backdrop-blur">
    <div class="flex flex-col items-center gap-3 text-slate-300">
      <div class="h-10 w-10 animate-spin rounded-full border-4 border-violet-500/30 border-t-violet-500"></div>
      <p class="text-sm font-semibold">クラウドから読み込み中…</p>
      <div id="loadingHelp" class="hidden max-w-xs px-4 text-center">
        <p class="text-xs leading-relaxed text-slate-400">
          クラウドに接続できません。ネット接続と、Firebaseで Firestore Database が作成済みかを確認してください。
        </p>
        <div class="mt-3 flex justify-center gap-2">
          <button data-loading="reload" class="btn btn-secondary">再読み込み</button>
          <button data-loading="logout" class="btn btn-secondary">ログアウト</button>
        </div>
      </div>
    </div>
  </div>

  <!-- トースト -->
  <div id="toastWrap" class="pointer-events-none fixed inset-x-0 bottom-4 z-[60] flex flex-col items-center gap-2 px-4"></div>

  <script type="module">
    /* =========================================================
     * ▼▼▼ Firebase 設定 ▼▼▼
     * Firebaseコンソール →「プロジェクトの設定」→「マイアプリ」の
     * firebaseConfig の値をここに貼り付けてください。
     * apiKey が空のままなら、この端末だけに保存する「ローカルモード」で動作します。
     * ※ これらの値は公開されても問題ない設定値です（データはFirestoreのルールで保護されます）。
     * ========================================================= */
    const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyCb7hm1T1OZsyysg1cjewnG_Ip_y2E-oII',
      authDomain: 'workoutapp-64948.firebaseapp.com',
      projectId: 'workoutapp-64948',
      storageBucket: 'workoutapp-64948.firebasestorage.app',
      messagingSenderId: '1062278156575',
      appId: '1:1062278156575:web:63d2382e397e8ea06d202a',
    };
    /* ▲▲▲ Firebase 設定ここまで ▲▲▲ */

  (() => {
    'use strict';

    /* =========================================================
     * 定数・ユーティリティ
     * ========================================================= */
    const STORAGE_KEY = 'liftlog.data.v1';
    const UI_KEY = 'liftlog.ui.v1';
    const MODE_KEY = 'liftlog.lastMode';
    const FIREBASE_VERSION = '12.6.0';
    const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
    const WD = ['日', '月', '火', '水', '木', '金', '土'];
    const DEFAULT_EXERCISES = ['ベンチプレス', 'スクワット', 'デッドリフト', 'ショルダープレス', 'ラットプルダウン', 'ダンベルカール'];
    const SET_GRID = 'grid grid-cols-[1.75rem_minmax(0,1fr)_minmax(0,1fr)_4.25rem_2rem] sm:grid-cols-[2rem_minmax(0,1fr)_minmax(0,1fr)_5rem_2.25rem] items-center gap-1.5 sm:gap-2';

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const pad = (n) => String(n).padStart(2, '0');
    const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const todayStr = () => toDateStr(new Date());
    const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return toDateStr(d); };
    const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
    const r2 = (n) => Math.round(n * 100) / 100;

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const num = (v) => {
      if (v === '' || v === null || v === undefined) return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    };

    const fmtNum = (n) => (n === null || n === undefined) ? '' : String(r2(n));
    const fmtVol = (n) => Math.round(n).toLocaleString('ja-JP');

    const fmtDateJP = (s) => {
      const d = parseDate(s);
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${WD[d.getDay()]})`;
    };
    const fmtShort = (s) => {
      const d = parseDate(s);
      const sameYear = d.getFullYear() === new Date().getFullYear();
      return `${sameYear ? '' : d.getFullYear() + '/'}${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`;
    };
    const relLabel = (s) => {
      const n = daysBetween(s, todayStr());
      if (n === 0) return '今日';
      if (n === 1) return '昨日';
      if (n === -1) return '明日';
      return n > 0 ? `${n}日前` : `${-n}日後`;
    };
    const relFrom = (from, to) => {
      const n = daysBetween(from, to);
      return n === 0 ? '同日' : `${n}日前`;
    };

    const icons = () => { if (window.lucide) window.lucide.createIcons(); };

    /* =========================================================
     * データ（localStorage）
     * ========================================================= */
    function defaultData() {
      return {
        version: 1,
        exercises: DEFAULT_EXERCISES.map((name) => ({ id: uid(), name })),
        workouts: {},   // { 'YYYY-MM-DD': [ { id, exerciseId, sets: [ { weight, reps } ] } ] }
        bodyweight: {}, // { 'YYYY-MM-DD': 72.35 }
      };
    }

    const emptyData = () => ({ version: 1, exercises: [], workouts: {}, bodyweight: {} });

    function normExercises(arr) {
      const out = [];
      const seen = new Set();
      if (!Array.isArray(arr)) return out;
      for (const e of arr) {
        if (!e || e.id === undefined || typeof e.name !== 'string' || !e.name.trim()) continue;
        const id = String(e.id);
        if (seen.has(id)) continue;
        seen.add(id);
        out.push(e.bw ? { id, name: e.name.trim().slice(0, 40), bw: true } : { id, name: e.name.trim().slice(0, 40) });
      }
      return out;
    }

    function normEntries(entries) {
      const list = [];
      if (!Array.isArray(entries)) return list;
      for (const en of entries) {
        if (!en || en.exerciseId === undefined) continue;
        const exerciseId = String(en.exerciseId);
        if (list.some((x) => x.exerciseId === exerciseId)) continue;
        const sets = Array.isArray(en.sets)
          ? en.sets.map((s) => ({ weight: num(s && s.weight), reps: num(s && s.reps) }))
          : [];
        list.push({ id: en.id ? String(en.id) : uid(), exerciseId, sets });
      }
      return list;
    }

    const normBodyweight = (v) => { const n = num(v); return n !== null && n > 0 ? r2(n) : null; };

    // 読み込んだデータを検証・正規化する（不正なら例外）
    function normalize(d) {
      if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('invalid root');
      if (!Array.isArray(d.exercises) && typeof d.workouts !== 'object' && typeof d.bodyweight !== 'object') {
        throw new Error('no known keys');
      }
      const out = emptyData();
      out.exercises = normExercises(d.exercises);
      const seen = new Set(out.exercises.map((e) => e.id));

      if (d.workouts && typeof d.workouts === 'object') {
        for (const [date, entries] of Object.entries(d.workouts)) {
          if (!DATE_RE.test(date)) continue;
          const list = normEntries(entries);
          for (const en of list) {
            // 種目マスタに存在しないIDは「不明な種目」として補完
            if (!seen.has(en.exerciseId)) {
              seen.add(en.exerciseId);
              out.exercises.push({ id: en.exerciseId, name: '不明な種目' });
            }
          }
          if (list.length) out.workouts[date] = list;
        }
      }

      if (d.bodyweight && typeof d.bodyweight === 'object') {
        for (const [date, v] of Object.entries(d.bodyweight)) {
          const n = normBodyweight(v);
          if (DATE_RE.test(date) && n !== null) out.bodyweight[date] = n;
        }
      }
      return out;
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return normalize(JSON.parse(raw));
      } catch (e) {
        console.warn('データの読み込みに失敗しました', e);
      }
      return defaultData();
    }

    function save() {
      // 空になった日付を掃除
      for (const [d, list] of Object.entries(state.workouts)) {
        if (!list.length) delete state.workouts[d];
      }
      if (mode === 'cloud') { scheduleFlush(); return; }
      if (mode !== 'local') return;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        toast('保存に失敗しました（ストレージ容量またはプライベートモードの制限）', 'error');
      }
    }

    function loadUI() {
      try { return JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch { return {}; }
    }
    function saveUI() {
      try {
        localStorage.setItem(UI_KEY, JSON.stringify({
          tab: ui.tab, statTarget: ui.statTarget, statMetric: ui.statMetric, statRange: ui.statRange,
        }));
      } catch { /* noop */ }
    }

    const CLOUD_ENABLED = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
    const lastMode = (() => { try { return localStorage.getItem(MODE_KEY); } catch { return null; } })();

    // 'local' = この端末のみ / 'cloud' = Firebase同期 / 'pending' = ログイン状態の確認中
    let mode = CLOUD_ENABLED && lastMode === 'cloud' ? 'pending' : 'local';
    let state = mode === 'local' ? load() : emptyData();
    const savedUI = loadUI();
    const ui = {
      date: todayStr(),
      tab: ['workout', 'weight', 'stats', 'ai'].includes(savedUI.tab) ? savedUI.tab : 'workout',
      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth(),
      calOpen: false,
      selectedExerciseId: '',
      statTarget: typeof savedUI.statTarget === 'string' ? savedUI.statTarget : '',
      statMetric: typeof savedUI.statMetric === 'string' ? savedUI.statMetric : 'e10',
      statRange: typeof savedUI.statRange === 'string' ? savedUI.statRange : '90',
      statTable: false,
    };

    /* =========================================================
     * ドメインロジック
     * ========================================================= */
    const getExercise = (id) => state.exercises.find((e) => e.id === id);
    const dayEntries = (date = ui.date) => state.workouts[date] || [];
    const getEntry = (id) => dayEntries().find((e) => e.id === id);

    // 有効なセット = 重量と回数が入力済み（回数 > 0）
    const validSets = (sets) => sets.filter((s) => s.weight !== null && s.reps !== null && s.weight >= 0 && s.reps > 0);

    function summarize(sets) {
      if (!sets.length) return null;
      let best = null;
      for (const s of sets) {
        if (!best || s.weight > best.weight || (s.weight === best.weight && s.reps > best.reps)) best = s;
      }
      return {
        maxWeight: best.weight,
        repsAtMax: best.reps,
        volume: sets.reduce((a, s) => a + s.weight * s.reps, 0),
        setCount: sets.length,
      };
    }

    // 指定日付より前で最後に記録された実績
    function findPrevious(exerciseId, beforeDate) {
      const dates = Object.keys(state.workouts).filter((d) => d < beforeDate).sort().reverse();
      for (const d of dates) {
        const en = state.workouts[d].find((e) => e.exerciseId === exerciseId);
        if (!en) continue;
        const sets = validSets(en.sets);
        if (sets.length) return { date: d, sets, summary: summarize(sets) };
      }
      return null;
    }

    // 重量優先 → 同重量なら回数で比較
    function compareVals(w1, rp1, w2, rp2) {
      const a = Math.round(w1 * 100), b = Math.round(w2 * 100);
      if (a > b) return 'up';
      if (a < b) return 'down';
      if (rp1 > rp2) return 'up';
      if (rp1 < rp2) return 'down';
      return 'keep';
    }

    const hasWorkout = (date) => dayEntries(date).some((en) => validSets(en.sets).length > 0);

    function bodyweightAt(date) {
      const ds = Object.keys(state.bodyweight).sort();
      if (!ds.length) return null;
      let hit = null;
      for (const d of ds) { if (d <= date) hit = d; else break; }
      return state.bodyweight[hit || ds[0]];
    }

    function prevBodyweight(before) {
      const ds = Object.keys(state.bodyweight).filter((d) => d < before).sort();
      const d = ds[ds.length - 1];
      return d ? { date: d, value: state.bodyweight[d] } : null;
    }

    /* =========================================================
     * 表示パーツ
     * ========================================================= */
    const TREND = {
      up:    { label: '↑ UP',   cls: 'bg-emerald-500/15 text-emerald-300 ring-emerald-400/40' },
      keep:  { label: '→ KEEP', cls: 'bg-amber-500/15 text-amber-300 ring-amber-400/40' },
      down:  { label: '↓ DOWN', cls: 'bg-rose-500/15 text-rose-300 ring-rose-400/40' },
      new:   { label: '★ NEW',  cls: 'bg-violet-500/15 text-violet-300 ring-violet-400/40' },
      first: { label: '★ 初回', cls: 'bg-violet-500/15 text-violet-300 ring-violet-400/40' },
      none:  { label: '—',      cls: 'bg-slate-800/80 text-slate-500 ring-white/5' },
    };

    function badge(trend, big = false) {
      const t = TREND[trend] || TREND.none;
      const size = big ? 'px-3 py-1.5 text-sm' : 'px-2 py-0.5 text-[11px]';
      return `<span class="inline-flex items-center justify-center whitespace-nowrap rounded-full font-extrabold tracking-wide ring-1 ${size} ${t.cls}">${t.label}</span>`;
    }

    // 自重種目は「自重」「自重+5kg」と表示（重量欄は加重分）
    const isBwExercise = (id) => !!(getExercise(id) || {}).bw;
    const loadText = (w, bw) => (bw ? (w ? `自重+${fmtNum(w)}` : '自重') : fmtNum(w));
    const loadHTML = (w, bw) => {
      const kg = '<span class="text-xs font-semibold text-slate-400">kg</span>';
      if (!bw) return `${fmtNum(w)}${kg}`;
      return w ? `自重+${fmtNum(w)}${kg}` : '自重';
    };
    const weightRepsHTML = (w, r, bw = false) =>
      `<span class="tabular-nums">${loadHTML(w, bw)} × ${r}<span class="text-xs font-semibold text-slate-400">回</span></span>`;

    /* =========================================================
     * 日付・カレンダー
     * ========================================================= */
    function setDate(d) {
      if (!DATE_RE.test(d)) return;
      ui.date = d;
      const dt = parseDate(d);
      ui.calYear = dt.getFullYear();
      ui.calMonth = dt.getMonth();
      renderAll();
    }

    function renderDateBar() {
      $('#dateLabel').textContent = fmtDateJP(ui.date);
      const rel = relLabel(ui.date);
      const relEl = $('#dateRel');
      relEl.textContent = rel;
      relEl.className = 'mt-0.5 text-xs font-semibold ' + (rel === '今日' ? 'text-violet-300' : 'text-slate-400');
      $('#datePicker').value = ui.date;
      $('#btnToday').disabled = ui.date === todayStr();
    }

    function renderCalendar() {
      const y = ui.calYear, m = ui.calMonth;
      const startDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const today = todayStr();

      let cells = '';
      for (let i = 0; i < startDay; i++) cells += '<div></div>';
      for (let day = 1; day <= daysInMonth; day++) {
        const ds = `${y}-${pad(m + 1)}-${pad(day)}`;
        const dow = (startDay + day - 1) % 7;
        const selected = ds === ui.date;
        const isToday = ds === today;
        const w = hasWorkout(ds);
        const b = state.bodyweight[ds] !== undefined;
        let color = dow === 0 ? 'text-rose-300' : dow === 6 ? 'text-sky-300' : 'text-slate-200';
        let bg = 'hover:bg-white/5';
        if (selected) { color = 'text-white'; bg = 'bg-violet-600 shadow-lg shadow-violet-600/30'; }
        const ring = isToday && !selected ? 'ring-1 ring-violet-400/70' : '';
        cells += `
          <button data-date="${ds}" class="relative flex aspect-square flex-col items-center justify-center rounded-xl text-sm font-semibold transition ${color} ${bg} ${ring}">
            <span class="tabular-nums">${day}</span>
            <span class="mt-0.5 flex h-1.5 gap-0.5">
              ${w ? `<span class="h-1.5 w-1.5 rounded-full ${selected ? 'bg-white' : 'bg-orange-400'}"></span>` : ''}
              ${b ? `<span class="h-1.5 w-1.5 rounded-full ${selected ? 'bg-sky-200' : 'bg-sky-400'}"></span>` : ''}
            </span>
          </button>`;
      }

      $('#calendar').innerHTML = `
        <div class="mb-2 flex items-center justify-between">
          <button data-cal="prev" class="icon-btn" title="前の月"><i data-lucide="chevron-left"></i></button>
          <div class="text-sm font-bold">${y}年 ${m + 1}月</div>
          <button data-cal="next" class="icon-btn" title="次の月"><i data-lucide="chevron-right"></i></button>
        </div>
        <div class="grid grid-cols-7 gap-1 pb-1 text-center text-[11px] font-bold">
          ${WD.map((w, i) => `<div class="${i === 0 ? 'text-rose-400/80' : i === 6 ? 'text-sky-400/80' : 'text-slate-500'}">${w}</div>`).join('')}
        </div>
        <div class="grid grid-cols-7 gap-1">${cells}</div>
        <div class="mt-3 flex items-center justify-center gap-4 text-[11px] text-slate-400">
          <span class="flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-orange-400"></span>筋トレ</span>
          <span class="flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-sky-400"></span>体重</span>
        </div>`;
    }

    function renderCalToggle() {
      const wrap = $('#calendarWrap');
      wrap.classList.toggle('hidden', !ui.calOpen);
      $('#btnCal').classList.toggle('text-violet-300', ui.calOpen);
    }

    function renderStats() {
      const workoutDays = Object.keys(state.workouts).filter(hasWorkout).length;
      const items = [
        ['種目', state.exercises.length],
        ['筋トレ日', workoutDays],
        ['体重', Object.keys(state.bodyweight).length],
      ];
      $('#dataStats').innerHTML = items.map(([k, v]) => `
        <div class="rounded-xl bg-slate-800/60 px-2 py-2">
          <dt class="text-[10px] font-semibold text-slate-500">${k}</dt>
          <dd class="text-lg font-extrabold tabular-nums">${v}</dd>
        </div>`).join('');
    }

    /* =========================================================
     * タブ
     * ========================================================= */
    function renderTabs() {
      $$('.tab-btn').forEach((b) => {
        const active = b.dataset.tab === ui.tab;
        b.classList.toggle('active', active);
        b.setAttribute('aria-selected', String(active));
      });
      $('#tabWorkout').classList.toggle('hidden', ui.tab !== 'workout');
      $('#tabWeight').classList.toggle('hidden', ui.tab !== 'weight');
      $('#tabStats').classList.toggle('hidden', ui.tab !== 'stats');
      $('#tabAI').classList.toggle('hidden', ui.tab !== 'ai');
      if (ui.tab === 'stats') renderAnalytics();
      if (ui.tab === 'ai') renderAI();
    }

    /* =========================================================
     * 筋トレ
     * ========================================================= */
    function renderExerciseSelect() {
      const sel = $('#exerciseSelect');
      if (!state.exercises.length) {
        sel.innerHTML = '<option value="">種目がありません（「種目を追加」から登録）</option>';
        sel.disabled = true;
        ui.selectedExerciseId = '';
        $('#btnAddEntry').disabled = true;
        return;
      }
      sel.disabled = false;
      if (ui.selectedExerciseId && !getExercise(ui.selectedExerciseId)) ui.selectedExerciseId = '';
      const inDay = new Set(dayEntries().map((e) => e.exerciseId));
      sel.innerHTML = '<option value="">種目を選択してください</option>' + state.exercises.map((ex) =>
        `<option value="${esc(ex.id)}" ${ex.id === ui.selectedExerciseId ? 'selected' : ''}>${esc(ex.name)}${inDay.has(ex.id) ? '（記録中）' : ''}</option>`
      ).join('');
      const already = inDay.has(ui.selectedExerciseId);
      const btn = $('#btnAddEntry');
      btn.disabled = !ui.selectedExerciseId;
      btn.innerHTML = already
        ? '<i data-lucide="arrow-down-to-line"></i>記録へ移動'
        : '<i data-lucide="plus"></i>記録に追加';
    }

    function renderSelectPreview() {
      const box = $('#selectPreview');
      const id = ui.selectedExerciseId;
      if (!id) {
        box.innerHTML = `<p class="flex items-center gap-1.5 text-xs text-slate-500"><i data-lucide="info" class="h-3.5 w-3.5"></i>種目を選ぶと、この日より前の「前回の実績」が表示されます</p>`;
        return;
      }
      const prev = findPrevious(id, ui.date);
      if (!prev) {
        box.innerHTML = `
          <div class="flex items-center gap-2 rounded-xl bg-slate-800/60 px-3 py-2 text-sm text-slate-300 ring-1 ring-white/5">
            <i data-lucide="sparkles" class="h-4 w-4 text-violet-300"></i>前回の記録はありません（今回が初記録です）
          </div>`;
        return;
      }
      box.innerHTML = `
        <div class="flex flex-wrap items-center gap-x-4 gap-y-1 rounded-xl bg-violet-500/10 px-3 py-2 text-sm ring-1 ring-violet-400/20">
          <span class="flex items-center gap-1.5 font-semibold text-violet-300"><i data-lucide="history" class="h-4 w-4"></i>前回 ${fmtShort(prev.date)}・${relFrom(prev.date, ui.date)}</span>
          <span>最大 <b>${weightRepsHTML(prev.summary.maxWeight, prev.summary.repsAtMax, isBwExercise(id))}</b></span>
          <span class="text-slate-400">${prev.summary.setCount}セット${isBwExercise(id) ? '' : ` / ${fmtVol(prev.summary.volume)}kg`}</span>
        </div>`;
    }

    function prevPanelHTML(prev, bw) {
      const prevSide = prev
        ? `<div class="text-[11px] font-semibold text-slate-500">前回 最大</div>
           <div class="text-lg font-extrabold">${weightRepsHTML(prev.summary.maxWeight, prev.summary.repsAtMax, bw)}</div>`
        : `<div class="text-[11px] font-semibold text-slate-500">前回</div>
           <div class="text-sm font-semibold text-slate-400">記録なし</div>`;
      const chips = prev
        ? `<div class="mt-2 flex flex-wrap items-center gap-1.5 border-t border-white/5 pt-2">
             <span class="flex items-center gap-1 text-[11px] font-semibold text-slate-500"><i data-lucide="history" class="h-3.5 w-3.5"></i>${fmtShort(prev.date)}・${relFrom(prev.date, ui.date)}</span>
             ${prev.sets.map((s, i) => `<span class="rounded-md bg-slate-900/80 px-1.5 py-0.5 text-[11px] font-semibold tabular-nums text-slate-300 ring-1 ring-white/5">${i + 1}: ${loadText(s.weight, bw)}×${s.reps}</span>`).join('')}
           </div>`
        : '';
      return `
        <div class="rounded-xl bg-slate-800/50 p-3 ring-1 ring-white/5">
          <div class="grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-2">
            <div class="min-w-0">${prevSide}</div>
            <div data-role="overall" class="flex justify-center"></div>
            <div class="min-w-0 text-right">
              <div class="text-[11px] font-semibold text-slate-500">今回 最大</div>
              <div data-role="cur-max" class="text-lg font-extrabold">—</div>
            </div>
          </div>
          ${chips}
        </div>`;
    }

    function setRowHTML(s, i, prev, bw) {
      const p = prev && prev.sets[i];
      return `
        <div class="${SET_GRID}" data-row="${i}">
          <div class="grid h-10 place-items-center rounded-lg bg-slate-800 text-sm font-extrabold text-slate-300 tabular-nums">${i + 1}</div>
          <input data-field="weight" data-index="${i}" type="number" inputmode="decimal" step="any" min="0"
            class="input h-10 w-full px-2 text-center font-bold tabular-nums" value="${fmtNum(s.weight)}"
            placeholder="${p ? fmtNum(p.weight) : bw ? '0' : 'kg'}" aria-label="第${i + 1}セット ${bw ? '加重' : '重量'}(kg)">
          <input data-field="reps" data-index="${i}" type="number" inputmode="numeric" step="1" min="0"
            class="input h-10 w-full px-2 text-center font-bold tabular-nums" value="${s.reps ?? ''}"
            placeholder="${p ? p.reps : '回'}" aria-label="第${i + 1}セット 回数">
          <div data-role="set-badge" class="flex justify-center"></div>
          <button data-action="delete-set" data-index="${i}" class="icon-btn h-10 w-full p-0 text-slate-500 hover:text-rose-400" title="このセットを削除">
            <i data-lucide="x"></i>
          </button>
        </div>`;
    }

    function entryCardHTML(entry) {
      const ex = getExercise(entry.exerciseId);
      const prev = findPrevious(entry.exerciseId, ui.date);
      const bw = !!(ex && ex.bw);
      const rows = entry.sets.length
        ? entry.sets.map((s, i) => setRowHTML(s, i, prev, bw)).join('')
        : `<p class="rounded-xl border border-dashed border-white/10 py-4 text-center text-sm text-slate-500">セットがありません。「セット追加」で入力を始めましょう。</p>`;
      return `
        <article class="card anim-pop overflow-hidden" data-entry-id="${esc(entry.id)}">
          <div class="flex items-center justify-between gap-3 border-b border-white/5 px-4 py-3">
            <div class="flex min-w-0 items-center gap-2.5">
              <div class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-violet-500/15 text-violet-300"><i data-lucide="dumbbell" class="h-4 w-4"></i></div>
              <h3 class="truncate font-bold">${esc(ex ? ex.name : '不明な種目')}</h3>
              ${bw ? '<span class="shrink-0 rounded-full bg-sky-500/15 px-2 py-0.5 text-[10px] font-bold text-sky-300 ring-1 ring-sky-400/30">自重</span>' : ''}
            </div>
            <button data-action="delete-entry" class="icon-btn text-slate-500 hover:text-rose-400" title="この種目の記録を削除">
              <i data-lucide="trash-2"></i>
            </button>
          </div>
          <div class="px-4 pt-3">${prevPanelHTML(prev, bw)}</div>
          <div class="px-4 py-3">
            ${entry.sets.length ? `
            <div class="${SET_GRID} px-0.5 pb-1.5 text-[10px] font-bold tracking-wider text-slate-500 sm:text-[11px]">
              <div class="text-center">SET</div><div class="text-center">${bw ? '加重 (kg)' : '重量 (kg)'}</div><div class="text-center">回数 (reps)</div><div class="text-center">前回比</div><div></div>
            </div>` : ''}
            ${bw ? '<p class="mb-2 text-[11px] text-slate-500">自重種目：重量欄には「加重分」を入力します（自重のみなら 0）。</p>' : ''}
            <div data-role="sets" class="space-y-2">${rows}</div>
            <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
              <button data-action="add-set" class="btn btn-secondary"><i data-lucide="plus"></i>セット追加</button>
              <div data-role="volume" class="text-right text-xs text-slate-400"></div>
            </div>
          </div>
        </article>`;
    }

    // 入力中にフォーカスを失わないよう、インジケーター部分だけ更新する
    function updateCardIndicators(card, entry) {
      if (!card || !entry) return;
      const prev = findPrevious(entry.exerciseId, ui.date);
      const cur = summarize(validSets(entry.sets));
      const bw = isBwExercise(entry.exerciseId);

      // 全体比較（最大重量 → 同重量なら回数）
      let overall = 'none';
      if (cur) overall = prev ? compareVals(cur.maxWeight, cur.repsAtMax, prev.summary.maxWeight, prev.summary.repsAtMax) : 'first';
      $('[data-role="overall"]', card).innerHTML = badge(overall, true);
      $('[data-role="cur-max"]', card).innerHTML = cur ? weightRepsHTML(cur.maxWeight, cur.repsAtMax, bw) : '<span class="text-slate-500">—</span>';

      // セットごとの比較（前回の同じセット番号と比較）
      entry.sets.forEach((s, i) => {
        const cell = $(`[data-row="${i}"] [data-role="set-badge"]`, card);
        if (!cell) return;
        const valid = s.weight !== null && s.reps !== null && s.weight >= 0 && s.reps > 0;
        let t = 'none';
        if (valid && prev) {
          const p = prev.sets[i];
          t = p ? compareVals(s.weight, s.reps, p.weight, p.reps) : 'new';
        }
        cell.innerHTML = badge(t);
      });

      // ボリューム
      const vol = $('[data-role="volume"]', card);
      if (cur && bw) {
        const reps = validSets(entry.sets).reduce((a, s) => a + s.reps, 0);
        vol.innerHTML = `${cur.setCount}セット・合計 <b class="text-slate-200 tabular-nums">${reps}回</b>`;
      } else if (cur) {
        let diffHTML = '';
        if (prev) {
          const d = Math.round(cur.volume - prev.summary.volume);
          const c = d > 0 ? 'text-emerald-400' : d < 0 ? 'text-rose-400' : 'text-amber-400';
          diffHTML = ` <span class="${c} font-semibold">(${d > 0 ? '+' : ''}${d.toLocaleString('ja-JP')})</span>`;
        }
        vol.innerHTML = `${cur.setCount}セット・総ボリューム <b class="text-slate-200 tabular-nums">${fmtVol(cur.volume)}kg</b>${diffHTML}`;
      } else {
        vol.textContent = '重量と回数を入力してください';
      }
    }

    function renderDaySummary() {
      const entries = dayEntries();
      let exCount = 0, setCount = 0, volume = 0;
      for (const en of entries) {
        const vs = validSets(en.sets);
        if (vs.length) exCount++;
        setCount += vs.length;
        volume += vs.reduce((a, s) => a + s.weight * s.reps, 0);
      }
      $('#daySummary').innerHTML = exCount
        ? `${exCount}種目・${setCount}セット・総ボリューム <b class="text-slate-200 tabular-nums">${fmtVol(volume)}kg</b>`
        : '';
    }

    function renderWorkout() {
      renderExerciseSelect();
      renderSelectPreview();
      const entries = dayEntries();
      const list = $('#entryList');
      if (!entries.length) {
        list.innerHTML = `
          <div class="card flex flex-col items-center gap-3 px-6 py-12 text-center">
            <div class="grid h-14 w-14 place-items-center rounded-2xl bg-slate-800 text-slate-500"><i data-lucide="clipboard-list" class="h-7 w-7"></i></div>
            <div>
              <p class="font-bold text-slate-300">${fmtShort(ui.date)} の記録はまだありません</p>
              <p class="mt-1 text-sm text-slate-500">上のセレクトボックスで種目を選び「記録に追加」を押してください。</p>
            </div>
          </div>`;
      } else {
        list.innerHTML = entries.map(entryCardHTML).join('');
        $$('[data-entry-id]', list).forEach((card) => updateCardIndicators(card, getEntry(card.dataset.entryId)));
      }
      renderDaySummary();
      icons();
    }

    function rerenderCard(entryId) {
      const card = $(`[data-entry-id="${CSS.escape(entryId)}"]`);
      const entry = getEntry(entryId);
      if (!card || !entry) { renderWorkout(); return; }
      card.outerHTML = entryCardHTML(entry);
      const fresh = $(`[data-entry-id="${CSS.escape(entryId)}"]`);
      fresh.classList.remove('anim-pop');
      updateCardIndicators(fresh, entry);
      renderDaySummary();
      icons();
      return fresh;
    }

    function addEntry(exId) {
      if (!exId) { toast('種目を選択してください', 'error'); return; }
      const list = dayEntries();
      const exist = list.find((e) => e.exerciseId === exId);
      if (exist) { scrollToEntry(exist.id); return; }
      const prev = findPrevious(exId, ui.date);
      const entry = {
        id: uid(),
        exerciseId: exId,
        // 基本は3セット。1セット目を入力すると、同じ値のままのセットにも自動で反映される
        sets: Array.from({ length: 3 }, () => ({
          weight: prev ? prev.sets[0].weight : isBwExercise(exId) ? 0 : null,
          reps: null,
        })),
      };
      if (!state.workouts[ui.date]) state.workouts[ui.date] = [];
      state.workouts[ui.date].push(entry);
      save();
      renderWorkout();
      renderCalendar();
      icons();
      const card = scrollToEntry(entry.id);
      const input = card && $(prev ? 'input[data-field="reps"]' : 'input[data-field="weight"]', card);
      if (input) input.focus({ preventScroll: true });
    }

    function scrollToEntry(id) {
      const card = $(`[data-entry-id="${CSS.escape(id)}"]`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('ring-2', 'ring-violet-500/60');
        setTimeout(() => card.classList.remove('ring-2', 'ring-violet-500/60'), 1200);
      }
      return card;
    }

    /* =========================================================
     * 体重
     * ========================================================= */
    function fmtDiff(d) {
      const v = r2(d);
      if (v === 0) return '±0.00kg';
      return `${v > 0 ? '+' : '-'}${Math.abs(v).toFixed(2)}kg`;
    }
    const diffColor = (d) => (r2(d) > 0 ? 'text-orange-300' : r2(d) < 0 ? 'text-sky-300' : 'text-slate-300');

    function renderWeight() {
      $('#wDateLabel').textContent = `${fmtShort(ui.date)} の体重`;
      const saved = state.bodyweight[ui.date];
      $('#weightInput').value = saved !== undefined ? saved.toFixed(2) : '';
      $('#btnDeleteWeight').classList.toggle('hidden', saved === undefined);
      renderWeightDiff();
      renderWeightHistory();
      icons();
    }

    function renderWeightDiff() {
      const saved = state.bodyweight[ui.date];
      const raw = num($('#weightInput').value);
      const v = raw !== null && raw > 0 ? r2(raw) : null;
      const prev = prevBodyweight(ui.date);

      // ステータス表示
      const status = $('#weightStatus');
      if (v !== null && saved !== undefined && v === saved) {
        status.innerHTML = `<span class="inline-flex items-center gap-1 rounded-full bg-emerald-500/15 px-2.5 py-1 text-xs font-bold text-emerald-300 ring-1 ring-emerald-400/30">✓ 保存済み</span>`;
      } else if (v !== null) {
        status.innerHTML = `<span class="inline-flex items-center gap-1 rounded-full bg-amber-500/15 px-2.5 py-1 text-xs font-bold text-amber-300 ring-1 ring-amber-400/30">● 未保存</span>`;
      } else {
        status.innerHTML = `<span class="inline-flex items-center gap-1 rounded-full bg-slate-800 px-2.5 py-1 text-xs font-bold text-slate-400 ring-1 ring-white/5">未記録</span>`;
      }

      const box = $('#weightDiff');
      if (!prev) {
        box.innerHTML = `
          <div class="rounded-xl bg-slate-800/50 px-4 py-3 text-sm text-slate-400 ring-1 ring-white/5">
            この日より前の体重記録がないため、差分は表示されません。
          </div>`;
        return;
      }
      const diff = v !== null ? v - prev.value : null;
      box.innerHTML = `
        <div class="grid grid-cols-3 divide-x divide-white/5 rounded-xl bg-slate-800/50 ring-1 ring-white/5">
          <div class="px-3 py-3">
            <div class="text-[11px] font-semibold text-slate-500">前回 ${fmtShort(prev.date)}</div>
            <div class="mt-0.5 text-lg font-extrabold tabular-nums">${prev.value.toFixed(2)}<span class="text-xs text-slate-400">kg</span></div>
            <div class="text-[11px] text-slate-500">${relFrom(prev.date, ui.date)}</div>
          </div>
          <div class="px-3 py-3">
            <div class="text-[11px] font-semibold text-slate-500">今回</div>
            <div class="mt-0.5 text-lg font-extrabold tabular-nums">${v !== null ? v.toFixed(2) + '<span class="text-xs text-slate-400">kg</span>' : '<span class="text-slate-500">—</span>'}</div>
          </div>
          <div class="px-3 py-3">
            <div class="text-[11px] font-semibold text-slate-500">前回との差</div>
            <div class="mt-0.5 text-lg font-extrabold tabular-nums ${diff !== null ? diffColor(diff) : 'text-slate-500'}">${diff !== null ? fmtDiff(diff) : '—'}</div>
          </div>
        </div>`;
    }

    function renderWeightHistory() {
      const asc = Object.keys(state.bodyweight).sort();
      $('#weightCount').textContent = asc.length ? `全${asc.length}件` : '';
      if (!asc.length) {
        $('#weightHistory').innerHTML = `<p class="py-6 text-center text-sm text-slate-500">まだ体重の記録がありません</p>`;
        return;
      }
      const rows = [];
      for (let i = asc.length - 1; i >= 0 && rows.length < 30; i--) {
        const d = asc[i];
        const v = state.bodyweight[d];
        const p = i > 0 ? state.bodyweight[asc[i - 1]] : null;
        const diff = p !== null ? v - p : null;
        const sel = d === ui.date;
        rows.push(`
          <button data-wdate="${d}" class="flex w-full items-center justify-between gap-3 rounded-xl px-3 py-2.5 text-left transition ${sel ? 'bg-violet-600/20 ring-1 ring-violet-500/40' : 'hover:bg-white/5'}">
            <span class="text-sm font-semibold ${sel ? 'text-violet-200' : 'text-slate-300'}">${fmtShort(d)}</span>
            <span class="flex items-center gap-3">
              <span class="w-20 text-right text-xs font-bold tabular-nums ${diff !== null ? diffColor(diff) : 'text-slate-600'}">${diff !== null ? fmtDiff(diff) : '—'}</span>
              <span class="w-20 text-right font-extrabold tabular-nums">${v.toFixed(2)}<span class="text-xs font-semibold text-slate-400">kg</span></span>
            </span>
          </button>`);
      }
      $('#weightHistory').innerHTML = `<div class="space-y-1">${rows.join('')}</div>`;
    }

    /* =========================================================
     * 種目管理モーダル
     * ========================================================= */
    function countRecords(exId) {
      return Object.values(state.workouts).filter((list) => list.some((e) => e.exerciseId === exId)).length;
    }

    function renderExList() {
      const ul = $('#exList');
      if (!state.exercises.length) {
        ul.innerHTML = `<li class="py-6 text-center text-sm text-slate-500">種目が登録されていません</li>`;
        return;
      }
      ul.innerHTML = state.exercises.map((ex) => {
        const c = countRecords(ex.id);
        return `
          <li class="flex items-center justify-between gap-2 rounded-xl bg-slate-800/60 px-3 py-2 ring-1 ring-white/5" data-ex-id="${esc(ex.id)}">
            <div class="min-w-0">
              <div class="truncate font-semibold">${esc(ex.name)}</div>
              <div class="text-[11px] text-slate-500">${c ? `記録 ${c}日分` : '記録なし'}</div>
            </div>
            <div class="flex shrink-0 items-center gap-1">
              <button data-ex-action="toggle-bw" class="rounded-full px-2.5 py-1 text-[11px] font-bold ring-1 transition ${ex.bw ? 'bg-sky-500/15 text-sky-300 ring-sky-400/40' : 'text-slate-500 ring-white/10 hover:text-slate-300'}" title="自重種目（懸垂など）として扱うか切り替え">自重</button>
              <button data-ex-action="rename" class="icon-btn text-slate-400" title="名前を変更"><i data-lucide="pencil"></i></button>
              <button data-ex-action="delete" class="icon-btn text-slate-400 hover:text-rose-400" title="削除"><i data-lucide="trash-2"></i></button>
            </div>
          </li>`;
      }).join('');
      icons();
    }

    function openExModal() {
      const m = $('#exModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
      renderExList();
      setTimeout(() => $('#exNameInput').focus(), 50);
    }
    function closeExModal() {
      const m = $('#exModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }
    const isModalOpen = () => !$('#exModal').classList.contains('hidden');

    function nameExists(name, exceptId) {
      const n = name.trim().toLowerCase();
      return state.exercises.some((e) => e.id !== exceptId && e.name.trim().toLowerCase() === n);
    }

    /* =========================================================
     * エクスポート / インポート
     * ========================================================= */
    function exportData() {
      const payload = { app: 'LiftLog', exportedAt: new Date().toISOString(), ...state };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `liftlog-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('JSONファイルを書き出しました');
    }

    async function importData(file) {
      try {
        const text = await file.text();
        const data = normalize(JSON.parse(text));
        const msg = [
          mode === 'cloud'
            ? 'インポートすると、クラウド上の現在のデータはすべて上書きされます（他の端末にも反映されます）。'
            : 'インポートすると、現在のデータはすべて上書きされます。',
          '',
          `種目: ${data.exercises.length}件`,
          `筋トレ記録: ${Object.keys(data.workouts).length}日分`,
          `体重記録: ${Object.keys(data.bodyweight).length}件`,
          '',
          'よろしいですか？',
        ].join('\n');
        if (!confirm(msg)) return;
        state = data;
        ui.selectedExerciseId = '';
        save();
        renderAll();
        toast('データを読み込みました');
      } catch (e) {
        console.error(e);
        toast('読み込みに失敗しました（不正なJSONファイルです）', 'error');
      }
    }

    /* =========================================================
     * トースト
     * ========================================================= */
    function toast(msg, type = 'ok') {
      const el = document.createElement('div');
      const style = type === 'error'
        ? 'bg-rose-950/95 text-rose-100 ring-rose-500/40'
        : 'bg-slate-800/95 text-slate-100 ring-white/10';
      el.className = `pointer-events-auto flex max-w-sm translate-y-2 items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold opacity-0 shadow-2xl ring-1 backdrop-blur transition duration-300 ${style}`;
      el.innerHTML = `<i data-lucide="${type === 'error' ? 'circle-alert' : 'check'}" class="h-4 w-4 shrink-0"></i><span>${esc(msg)}</span>`;
      $('#toastWrap').appendChild(el);
      icons();
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('opacity-0', 'translate-y-2')));
      setTimeout(() => {
        el.classList.add('opacity-0');
        setTimeout(() => el.remove(), 300);
      }, 2400);
    }

    /* =========================================================
     * 統計（種目ごとの推移グラフ）
     * ========================================================= */
    const BW_TARGET = '__bodyweight';
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const CHART_SURFACE = '#0f172a';
    const CHART_COLOR = { lift: '#8b5cf6', bodyweight: '#0b97d6' }; // ダーク背景で検証済みの色
    const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
    const r1 = (n) => Math.round(n * 10) / 10;

    const STAT_METRICS = {
      e10: {
        label: '10rep換算',
        note: '各セットを「重量 × 回数 ÷ 10」で10回あたりの重さに換算し、その日の平均を表示します（例：20kg×5回 も 10kg×10回 も 10kg）。',
        calc: (sets) => avg(sets.map((s) => (s.weight * s.reps) / 10)),
        fmt: (v) => String(r1(v)),
      },
      max: {
        label: '最大重量',
        note: 'その日のセットの中で一番重い重量です。',
        calc: (sets) => Math.max(...sets.map((s) => s.weight)),
        fmt: (v) => fmtNum(v),
      },
      e1rm: {
        label: '推定1RM',
        note: '1回だけ挙げられる重さの推定値（Epley式：重量 × (1 + 回数 ÷ 30)）の、その日の最大値です。筋力の伸びを見るときによく使われる指標です。',
        calc: (sets) => Math.max(...sets.map((s) => s.weight * (1 + s.reps / 30))),
        fmt: (v) => String(r1(v)),
      },
      volume: {
        label: '総ボリューム',
        note: 'その日の「重量 × 回数」の合計です。トレーニング量の目安になります。',
        calc: (sets) => sets.reduce((a, s) => a + s.weight * s.reps, 0),
        fmt: (v) => fmtVol(v),
      },
    };
    const STAT_RANGES = [['30', '30日'], ['90', '90日'], ['365', '1年'], ['all', '全期間']];

    // 記録がある種目（最近トレーニングした順）
    function exercisesWithRecords() {
      const last = new Map();
      for (const d of Object.keys(state.workouts).sort()) {
        for (const en of state.workouts[d]) {
          if (validSets(en.sets).length) last.set(en.exerciseId, d);
        }
      }
      return state.exercises
        .filter((e) => last.has(e.id))
        .sort((a, b) => (last.get(b.id) < last.get(a.id) ? -1 : 1));
    }

    function statSeries() {
      const cutoff = ui.statRange === 'all' ? '' : addDays(todayStr(), -Number(ui.statRange) + 1);
      if (ui.statTarget === BW_TARGET) {
        return Object.keys(state.bodyweight).sort().filter((d) => d >= cutoff)
          .map((d) => ({ date: d, value: state.bodyweight[d], detail: '' }));
      }
      const metric = STAT_METRICS[ui.statMetric];
      const bw = isBwExercise(ui.statTarget);
      const out = [];
      for (const d of Object.keys(state.workouts).sort()) {
        if (d < cutoff) continue;
        const en = state.workouts[d].find((e) => e.exerciseId === ui.statTarget);
        const vs = en ? validSets(en.sets) : [];
        if (!vs.length) continue;
        const body = bw ? bodyweightAt(d) : 0;
        const calcSets = bw ? vs.map((s) => ({ weight: (body || 0) + s.weight, reps: s.reps })) : vs;
        out.push({
          date: d,
          value: metric.calc(calcSets),
          detail: vs.map((s) => `${loadText(s.weight, bw)}×${s.reps}`).join(', ') + (bw && body ? `（体重 ${body.toFixed(1)}kg）` : ''),
        });
      }
      return out;
    }

    function niceScale(min, max, count = 4) {
      if (min === max) { const pad = Math.abs(min) * 0.05 || 1; min -= pad; max += pad; }
      const raw = (max - min) / count;
      const mag = 10 ** Math.floor(Math.log10(raw));
      const n = raw / mag;
      const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
      const lo = Math.floor(min / step) * step;
      const hi = Math.ceil(max / step) * step;
      const decimals = Math.max(0, -Math.floor(Math.log10(step) + 1e-9) + (step / mag === 2.5 ? 1 : 0));
      const ticks = [];
      for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Number(v.toFixed(decimals)));
      return { lo, hi, ticks, decimals };
    }

    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function drawChart(box, points, { color, fmt, unit }) {
      box.innerHTML = '';
      const W = box.clientWidth;
      if (!W) return;
      const H = W < 500 ? 230 : 270;
      const m = { t: 18, r: 16, b: 28, l: 44 };
      const pw = W - m.l - m.r, ph = H - m.t - m.b;

      const times = points.map((p) => parseDate(p.date).getTime());
      const t0 = times[0], t1 = times[times.length - 1];
      const xOf = (t) => (t1 === t0 ? m.l + pw / 2 : m.l + ((t - t0) / (t1 - t0)) * pw);
      const vals = points.map((p) => p.value);
      const sc = niceScale(Math.min(...vals), Math.max(...vals));
      const yOf = (v) => m.t + ph - ((v - sc.lo) / (sc.hi - sc.lo)) * ph;

      const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img' });
      svg.style.touchAction = 'pan-y';
      svg.style.display = 'block';

      // 目盛り・グリッド（控えめな実線のヘアライン）
      for (const v of sc.ticks) {
        const y = yOf(v);
        svg.appendChild(svgEl('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: 'rgba(255,255,255,0.07)', 'stroke-width': 1 }));
        const t = svgEl('text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end', fill: '#64748b', 'font-size': 11, 'font-variant-numeric': 'tabular-nums' });
        t.textContent = v.toLocaleString('ja-JP', { maximumFractionDigits: sc.decimals });
        svg.appendChild(t);
      }

      // X軸の日付ラベル
      const spanYears = new Date(t1).getFullYear() !== new Date(t0).getFullYear();
      const xLabel = (t) => { const d = new Date(t); return spanYears ? `${String(d.getFullYear()).slice(2)}/${d.getMonth() + 1}/${d.getDate()}` : `${d.getMonth() + 1}/${d.getDate()}`; };
      const nX = t1 === t0 ? 1 : Math.max(2, Math.min(5, Math.floor(pw / 90)));
      for (let i = 0; i < nX; i++) {
        const t = nX === 1 ? t0 : t0 + ((t1 - t0) * i) / (nX - 1);
        const anchor = nX === 1 ? 'middle' : i === 0 ? 'start' : i === nX - 1 ? 'end' : 'middle';
        const tx = svgEl('text', { x: xOf(t), y: H - 8, 'text-anchor': anchor, fill: '#64748b', 'font-size': 11 });
        tx.textContent = xLabel(t);
        svg.appendChild(tx);
      }

      // 折れ線（2px・角丸）
      const pts = points.map((p, i) => [xOf(times[i]), yOf(p.value)]);
      if (pts.length > 1) {
        svg.appendChild(svgEl('path', {
          d: pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join(''),
          fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
        }));
      }

      // 点（背景色のリング付き）。点が多いときは最新の点だけ表示
      const showAll = pts.length <= 60;
      pts.forEach(([x, y], i) => {
        if (!showAll && i !== pts.length - 1) return;
        svg.appendChild(svgEl('circle', { cx: x, cy: y, r: 4, fill: color, stroke: CHART_SURFACE, 'stroke-width': 2 }));
      });

      // 最新値だけ直接ラベル
      const [lx, ly] = pts[pts.length - 1];
      const endLabel = svgEl('text', {
        x: lx, y: ly - 10, 'text-anchor': pts.length === 1 ? 'middle' : 'end',
        fill: '#e2e8f0', 'font-size': 12, 'font-weight': 700,
      });
      endLabel.textContent = `${fmt(points[points.length - 1].value)}${unit}`;
      svg.appendChild(endLabel);

      // ホバー：縦の補助線＋ツールチップ（最も近い日付にスナップ）
      const cross = svgEl('line', { y1: m.t, y2: m.t + ph, stroke: '#64748b', 'stroke-width': 1, visibility: 'hidden' });
      const focus = svgEl('circle', { r: 6, fill: color, stroke: CHART_SURFACE, 'stroke-width': 2, visibility: 'hidden' });
      svg.appendChild(cross);
      svg.appendChild(focus);
      const hit = svgEl('rect', { x: m.l - 12, y: 0, width: pw + 24, height: H, fill: 'transparent' });
      svg.appendChild(hit);
      box.appendChild(svg);

      const tip = document.createElement('div');
      tip.className = 'pointer-events-none absolute z-10 hidden min-w-[7rem] rounded-xl bg-slate-800/95 px-3 py-2 text-left shadow-2xl ring-1 ring-white/10 backdrop-blur';
      const tipVal = document.createElement('div');
      tipVal.className = 'text-sm font-extrabold text-white';
      const tipDate = document.createElement('div');
      tipDate.className = 'text-[11px] font-semibold text-slate-400';
      const tipDetail = document.createElement('div');
      tipDetail.className = 'mt-0.5 max-w-[14rem] text-[11px] text-slate-500';
      tip.append(tipVal, tipDate, tipDetail);
      box.appendChild(tip);

      const show = (clientX) => {
        const rect = svg.getBoundingClientRect();
        const px = clientX - rect.left;
        let best = 0;
        for (let i = 1; i < pts.length; i++) if (Math.abs(pts[i][0] - px) < Math.abs(pts[best][0] - px)) best = i;
        const [x, y] = pts[best];
        const p = points[best];
        cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
        focus.setAttribute('cx', x); focus.setAttribute('cy', y); focus.setAttribute('visibility', 'visible');
        tipVal.textContent = `${fmt(p.value)}${unit}`;
        tipDate.textContent = fmtDateJP(p.date);
        tipDetail.textContent = p.detail;
        tipDetail.style.display = p.detail ? '' : 'none';
        tip.classList.remove('hidden');
        const tw = tip.offsetWidth, th = tip.offsetHeight;
        let left = x + 12;
        if (left + tw > W) left = x - tw - 12;
        tip.style.left = `${Math.max(0, left)}px`;
        tip.style.top = `${Math.max(0, Math.min(y - th / 2, H - th))}px`;
      };
      const hide = () => {
        cross.setAttribute('visibility', 'hidden');
        focus.setAttribute('visibility', 'hidden');
        tip.classList.add('hidden');
      };
      hit.addEventListener('pointermove', (e) => show(e.clientX));
      hit.addEventListener('pointerdown', (e) => show(e.clientX));
      hit.addEventListener('pointerleave', hide);
    }

    function statTile(label, value, sub = '', subClass = 'text-slate-500') {
      return `
        <div class="card px-3 py-3">
          <div class="text-[11px] font-semibold text-slate-500">${label}</div>

    function renderAnalytics() {

          : statTile('期間ベスト', `${fmt(maxP.value)}${unitSpan}`, fmtShort(maxP.date)),

      drawChart(chartBox, points, { color: isBW ? CHART_COLOR.bodyweight : CHART_COLOR.lift, fmt, unit });

      // 表（グラフと同じ値）

          <div class="max-h-80 overflow-y-auto rounded-xl ring-1 ring-white/5">

              <thead class="sticky top-0 bg-slate-800 text-[11px] text-slate-400">
                <tr><th class="px-3 py-2 text-left font-semibold">日付</th><th class="px-3 py-2 text-right font-semibold">${isBW ? '体重' : esc(metric.label)} (kg)</th>${isBW ? '' : '<th class="px-3 py-2 text-left font-semibold">セット</th>'}</tr>
              </thead>

    $('#statTarget').addEventListener('change', (e) => { ui.statTarget = e.target.value; saveUI(); renderAnalytics(); });
    $('#statRange').addEventListener('click', (e) => {

    let lastChartWidth = 0;
    new ResizeObserver(() => {

      if (ui.tab === 'stats' && w && w !== lastChartWidth) { lastChartWidth = w; renderAnalytics(); }
    }).observe($('#statChart'));

    /* =========================================================
     * AIコーチ（Firebase AI Logic + Gemini Developer API）
     * ========================================================= */
    // 先頭から順に試し、使えないモデルなら次へ
    const AI_MODELS = ['gemini-3.8-flash', 'gemini-2.5-flash'];
    const AI_SYSTEM = [
      'あなたは経験豊富なパーソナルトレーナー兼ストレングスコーチです。',
      'ユーザーの筋トレ記録と体重記録を読み、日本語でアドバイスしてください。',
      '- 記録データに基づいて具体的に答える（日付・種目名・重量・回数を引用する）。',
      '- 種目名から鍛えている部位を推測し、部位のバランスや頻度にも目を配る。',
      '- 結論から先に書き、全体で400字程度。見出し（##）と箇条書き（-）で読みやすくする。',
      '- 記録から分からないことは推測であると明示する。データが少ない場合はその旨を伝える。',
      '- 怪我・痛み・病気・極端な減量など医療的な判断が必要な内容には踏み込まず、専門家への相談を勧める。',
      '- 重量の単位は kg。',
    ].join('\n');
    const AI_PRESETS = [
      ['最近の振り返り', '直近のトレーニング全体を振り返って、良い点・気になる点・次の1週間でやるべきことを教えて。'],
      ['部位のバランス', '部位ごとのトレーニング頻度のバランスを見て、最近やれていない部位があれば教えて。'],
      ['伸び悩み診断', '種目ごとの推定1RMの推移から、伸びている種目と停滞している種目を教えて。停滞している種目には対策も提案して。'],
      ['次回のメニュー', '今日の時点で、次回のトレーニングメニューを種目・重量・回数・セット数まで具体的に提案して。'],
      ['体重の推移', '体重の推移について、トレーニング内容との関係も含めてコメントして。'],
    ];
    const aiState = {
      mod: null, ai: null, modelIdx: 0,
      history: [],     // Gemini に渡す会話履歴（1通目にだけ記録データを含める）
      messages: [],    // 画面表示用 { role: 'user' | 'model', text, error }
      busy: false,
    };
    const aiAvailable = () => mode === 'cloud' && !!cloud.user && !!cloud.app;

    // 直近90日の記録を、AIが読みやすいテキストにまとめる
    function buildAIContext() {
      const today = todayStr();
      const from = addDays(today, -89);
      const e1rm = (sets) => Math.max(...sets.map((s) => s.weight * (1 + s.reps / 30)));
      const lines = [`今日の日付: ${today}（${WD[parseDate(today).getDay()]}曜日）`, ''];

      lines.push('## 種目ごとのまとめ');
      const dates = Object.keys(state.workouts).sort();
      for (const ex of state.exercises) {
        const sessions = dates
          .map((d) => { const en = state.workouts[d].find((e) => e.exerciseId === ex.id); const vs = en ? validSets(en.sets) : []; return vs.length ? { d, vs } : null; })
          .filter(Boolean);
        const label = ex.bw ? `${ex.name}（自重種目。「自重+5」は体重に5kg加重、「自重」は加重なし）` : ex.name;
        if (!sessions.length) { lines.push(`- ${label}: 記録なし`); continue; }
        const last = sessions[sessions.length - 1];
        const recent = sessions.filter((x) => x.d >= from);
        const best = Math.max(...sessions.map((x) => e1rm(x.vs)));
        if (ex.bw) {
          lines.push(`- ${label}: 最終実施 ${last.d}（${daysBetween(last.d, today)}日前）／直近90日で${recent.length}回／最新 ${last.vs.map((s) => `${loadText(s.weight, true)}×${s.reps}`).join(', ')}`);
          continue;
        }
        let trend = '';
        if (recent.length >= 2) trend = `／推定1RM ${r1(e1rm(recent[0].vs))}kg（${recent[0].d}）→ ${r1(e1rm(last.vs))}kg（${last.d}）`;
        else trend = `／推定1RM 最新 ${r1(e1rm(last.vs))}kg`;
        lines.push(`- ${ex.name}: 最終実施 ${last.d}（${daysBetween(last.d, today)}日前）／直近90日で${recent.length}回${trend}／自己ベスト推定1RM ${r1(best)}kg`);
      }

      lines.push('', '## 直近90日のトレーニング記録（重量kg×回数）');
      const recentDates = dates.filter((d) => d >= from);
      let count = 0;
      for (const d of recentDates) {
        const parts = state.workouts[d]
          .map((en) => { const vs = validSets(en.sets); if (!vs.length) return null; const ex = getExercise(en.exerciseId); return `${ex ? ex.name : '不明な種目'} ${vs.map((s) => `${loadText(s.weight, !!(ex && ex.bw))}×${s.reps}`).join(', ')}`; })
          .filter(Boolean);
        if (parts.length) { lines.push(`${d}(${WD[parseDate(d).getDay()]}): ${parts.join(' / ')}`); count++; }
      }
      if (!count) lines.push('記録なし');

      lines.push('', '## 直近90日の体重（kg）');
      const bw = Object.keys(state.bodyweight).sort().filter((d) => d >= from);
      lines.push(bw.length ? bw.map((d) => `${d}: ${state.bodyweight[d].toFixed(2)}`).join('\n') : '記録なし');
      return lines.join('\n');
    }

    // AIの回答（簡易Markdown）を安全なHTMLに変換
    function mdToHtml(md) {
      const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong class="text-white">$1</strong>');
      const out = [];
      let list = null;
      const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
      for (const raw of md.split('\n')) {
        const line = raw.trimEnd();
        let m;
        if ((m = line.match(/^#{1,4}\s+(.*)/))) {
          closeList();
          out.push(`<h4 class="mt-3 mb-1 font-bold text-violet-200 first:mt-0">${inline(m[1])}</h4>`);
        } else if ((m = line.match(/^\s*[-*・]\s+(.*)/))) {
          if (list !== 'ul') { closeList(); out.push('<ul class="my-1 list-disc space-y-1 pl-5">'); list = 'ul'; }
          out.push(`<li>${inline(m[1])}</li>`);
        } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
          if (list !== 'ol') { closeList(); out.push('<ol class="my-1 list-decimal space-y-1 pl-5">'); list = 'ol'; }
          out.push(`<li>${inline(m[1])}</li>`);
        } else if (!line.trim()) {
          closeList();
        } else {
          closeList();
          out.push(`<p class="my-1.5">${inline(line)}</p>`);
        }
      }
      closeList();
      return out.join('');
    }

    function aiErrorMessage(e) {
      const msg = String((e && (e.message || e.code)) || e);
      if (/api-not-enabled|has not been used|is disabled|SERVICE_DISABLED/i.test(msg)) {
        return 'FirebaseでAI Logicが有効になっていません。Firebaseコンソールの「AI サービス → AI Logic」で「始める」を押し、「Gemini Developer API」を選んで設定してください。';
      }
      if (/429|quota|RESOURCE_EXHAUSTED|rate/i.test(msg)) return '無料枠の利用上限に達したか、混み合っています。しばらく時間をおいてからお試しください。';
      if (/network|fetch|Failed to fetch/i.test(msg)) return 'ネットワークに接続できません。';
      return `AIの呼び出しに失敗しました（${msg.slice(0, 160)}）`;
    }
    const isModelNotFound = (e) => /404|not found|NOT_FOUND|is not supported|unsupported model|limit:\s*0|free.?tier/i.test(String((e && e.message) || e));

    async function getAIModel() {
      if (!aiState.mod) aiState.mod = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-ai.js`);
      if (!aiState.ai) aiState.ai = aiState.mod.getAI(cloud.app, { backend: new aiState.mod.GoogleAIBackend() });
      return aiState.mod.getGenerativeModel(aiState.ai, { model: AI_MODELS[aiState.modelIdx], systemInstruction: AI_SYSTEM });
    }

    async function askAI(question) {
      const q = question.trim();
      if (!q || aiState.busy) return;
      if (!aiAvailable()) { toast('AIコーチを使うにはログインしてください', 'error'); return; }
      aiState.busy = true;
      const isFirst = aiState.history.length === 0;
      const prompt = isFirst ? `以下は私のトレーニング記録です。\n\n${buildAIContext()}\n\n---\n質問：${q}` : q;
      aiState.messages.push({ role: 'user', text: q });
      const reply = { role: 'model', text: '', error: '' };
      aiState.messages.push(reply);
      renderAIThread();
      $('#aiInput').value = '';

      for (;;) {
        try {
          const model = await getAIModel();
          const chat = model.startChat({ history: aiState.history });
          const result = await chat.sendMessageStream(prompt);
          for await (const chunk of result.stream) {
            reply.text += chunk.text();
            updateLastAIBubble(reply);
          }
          aiState.history.push(
            { role: 'user', parts: [{ text: prompt }] },
            { role: 'model', parts: [{ text: reply.text }] },
          );
          break;
        } catch (e) {
          console.error(e);
          if (!reply.text && isModelNotFound(e) && aiState.modelIdx < AI_MODELS.length - 1) {
            aiState.modelIdx++;
            continue; // 別のモデルで再試行
          }
          reply.error = aiErrorMessage(e);
          break;
        }
      }
      aiState.busy = false;
      renderAIThread();
    }

    function aiBubbleHTML(msg, i) {
      if (msg.role === 'user') {
        return `<div class="flex justify-end"><div class="max-w-[85%] rounded-2xl rounded-br-md bg-violet-600 px-4 py-2.5 text-sm text-white shadow-lg shadow-violet-600/20">${esc(msg.text)}</div></div>`;
      }
      const loading = !msg.text && !msg.error;
      return `
        <div class="card px-4 py-3 text-sm leading-relaxed text-slate-200" data-ai-msg="${i}">
          <div class="mb-1 flex items-center gap-1.5 text-[11px] font-bold text-violet-300"><i data-lucide="sparkles" class="h-3.5 w-3.5"></i>AIコーチ</div>
          <div data-role="ai-body">${loading ? '<span class="inline-flex gap-1 py-1"><span class="h-2 w-2 animate-bounce rounded-full bg-violet-400"></span><span class="h-2 w-2 animate-bounce rounded-full bg-violet-400 [animation-delay:.15s]"></span><span class="h-2 w-2 animate-bounce rounded-full bg-violet-400 [animation-delay:.3s]"></span></span>' : mdToHtml(msg.text)}</div>
          ${msg.error ? `<p class="mt-2 rounded-lg bg-rose-500/10 px-3 py-2 text-xs text-rose-300 ring-1 ring-rose-400/30">${esc(msg.error)}</p>` : ''}
        </div>`;
    }

    function renderAIThread() {
      $('#aiThread').innerHTML = aiState.messages.map(aiBubbleHTML).join('');
      $('#aiReset').classList.toggle('hidden', !aiState.messages.length || aiState.busy);
      renderAIStatus();
      icons();
      const last = $('#aiThread').lastElementChild;

    function updateLastAIBubble(msg) {
      const body = $(`[data-ai-msg="${aiState.messages.length - 1}"] [data-role="ai-body"]`);
      if (body) body.innerHTML = mdToHtml(msg.text);

    function renderAIStatus() {
